taxonomy_version: v0.13
skills:
  - name: hunting-silent-failures
    description: >
      Reviews changes for swallowed or silently-handled errors — empty
      catch/rescue blocks, ignored returned errors, bare excepts, unhandled
      promise rejections, broad exception catches — and for unsafe fallbacks,
      missing timeouts, and absent retries/circuit-breakers. Use when reviewing
      error handling, exceptions, try/catch, rescue, fallback, resilience,
      timeouts, or resource cleanup on failure paths.
    picker: >
      Where do errors vanish? Swallowed exceptions, silent fallbacks, missing
      timeouts and retries.
    shape: diff
    design: true
    wave: 1
    tier: floor
    cross_ref: [4]    # primary owner: tracing-correctness-and-invariants
    # Q21: fifth and final hardened, adversarial/red-team-weighted eval suite
    # (the sweeping-for-security / tracing-correctness-and-invariants /
    # reviewing-migration-and-data-safety / reviewing-concurrency-and-async
    # precedent's A-E scenario groups), raised from D8's 3-scenario baseline
    # (this lens already had 6). See open-questions.md Q21.
    eval_min: 27
    built_from:
      - { category: 2, source: docs/research/cluster-1-correctness.md#2 }
      - { category: 4, source: docs/research/cluster-1-correctness.md#4 }

  - name: reviewing-naming-and-readability
    description: >
      Reviews code for naming and local readability: intention-revealing names
      vs placeholders, function length and cyclomatic/cognitive complexity, deep
      nesting, magic numbers/strings, mixed levels of abstraction, and comment
      accuracy. Use when reviewing readability, naming, complexity, nesting,
      magic values, or comments.
    picker: >
      Can a newcomer read this function? Names, length, nesting, magic values,
      comment accuracy.
    shape: diff
    wave: 1
    # Q21: third preference-tier lens hardened (wave-1-first rollout). Same
    # A-E adversarial taxonomy as the floor-tier lenses, minus the design-doc
    # (A) group — this lens is diff-only, not design-capable — raised from
    # D8's 3-scenario baseline. See open-questions.md Q21.
    eval_min: 25
    built_from:
      - { category: 5, source: docs/research/cluster-2-readability.md#5 }
      - { category: 6, source: docs/research/cluster-2-readability.md#6 }
      - { category: 7, source: docs/research/cluster-2-readability.md#7 }

  - name: reviewing-module-design
    description: >
      Reviews module and type design: cohesion and coupling (via connascence),
      encapsulation, hard-to-misuse interfaces, and making illegal states
      unrepresentable. Use when reviewing class/module structure, interfaces,
      type or data modeling, coupling, or API ergonomics for callers.
    picker: >
      Are the boundaries right? Coupling, encapsulation, interfaces that are
      hard to misuse, illegal states unrepresentable.
    shape: diff
    design: true
    wave: 1
    # Q21: first preference-tier lens hardened, opening the wave-1-first
    # rollout that follows the five floor-tier lenses. Same A-E adversarial
    # taxonomy, raised from D8's 3-scenario baseline. See open-questions.md Q21.
    eval_min: 26
    built_from:
      - { category: 9, source: docs/research/cluster-3-structure.md#9 }
      - { category: 10, source: docs/research/cluster-3-structure.md#10 }

  - name: checking-restraint
    description: >
      Reviews changes for over-engineering — premature abstraction, speculative
      generality, the wrong abstraction, and premature optimization without a
      profile. The restraint / brake-pedal lens. Use when a change adds
      abstraction layers, config knobs, generality, or hand-optimized code, or
      when asking whether a change is doing too much.
    picker: >
      Is this change too much? Premature abstraction or optimization — the
      brake pedal.
    shape: diff
    design: true
    wave: 1
    cross_ref: [15]   # primary owner: reviewing-performance-and-efficiency (counterweight lens here)
    # Q21: second preference-tier lens hardened (wave-1-first rollout). Same
    # A-E adversarial taxonomy, raised from this lens's prior 4-scenario
    # suite (above D8's 3-scenario baseline). See open-questions.md Q21.
    eval_min: 24
    built_from:
      - { category: 11, source: docs/research/cluster-3-structure.md#11 }
      - { category: 15, source: docs/research/cluster-4-runtime.md#15 }

  - name: reviewing-llm-integration
    description: >
      Reviews LLM/AI integration code for prompt-injection surface, the lethal
      trifecta, unvalidated model output, missing eval coverage, unpinned models,
      unbounded token/cost, and PII sent to third-party models. Use when
      reviewing code that calls an LLM or model API, builds prompts, parses
      model output, or wires up agents and tools. Skip when the change has no
      model/LLM call, prompt construction, or model-output handling — ordinary
      code that never touches an AI API.
    picker: >
      Is the model call safe and bounded? Injection surface, output validation,
      evals, token cost, PII.
    shape: diff
    design: true
    wave: 1
    cross_ref: [27]   # primary owner: auditing-compliance-and-provenance
    # Q21: fourth preference-tier lens hardened (wave-1-first rollout). Same
    # A-E adversarial taxonomy as the prior instances, including the design-doc
    # (A) group since this lens is design-capable, raised from D8's 3-scenario
    # baseline. See open-questions.md Q21.
    eval_min: 26
    built_from:
      - { category: 25, source: docs/research/cluster-4-runtime.md#25 }
      - { category: 27, source: docs/research/cluster-6-evolution.md#27 }

  - name: reviewing-agentic-safety
    description: >
      Reviews the action/tool surface of agent and tool-using systems — what the
      model is permitted to *do*, distinct from reviewing-llm-integration's review
      of the *model call*: tool least-privilege, approval gates and step/spend
      budgets on autonomous loops, tool metadata and MCP server descriptions as
      untrusted input (tool poisoning), confused-deputy and token-audience
      discipline (no token passthrough), inter-agent authentication,
      sandboxed code execution (no ambient credentials, egress allow-list),
      agent-memory hygiene, action audit trails, and the action-leg mitigations of
      the lethal trifecta. Grounded in OWASP's Top 10 for Agentic Applications
      (ASI01–ASI10) and the MCP security spec. Use when reviewing tool or function
      definitions exposed to a model, an MCP server or client, an autonomous or
      multi-agent loop, agent memory, or code that lets a model take actions. Skip
      when the change has no tools, agents, MCP, or autonomous loop — an ordinary
      model call with no action surface is reviewing-llm-integration's job.
    picker: >
      Is the agent's action surface safe? Tool least-privilege, approval gates &
      step budgets, untrusted tool metadata, sandboxed exec, egress control.
    shape: diff
    design: true
    wave: 5
    # Q21: fresh scope-to-coverage recompute after
    # reviewing-decision-lifecycle shipped (PR #261). Three-way tie at
    # the widest remaining gap (reviewing-agentic-safety,
    # reviewing-agent-legibility, reviewing-ethical-design, all 9 owned
    # checks / 4 baseline scenarios); picked this one for direct
    # thematic relevance to this session (this repo runs its own
    # agentic PR-review routines) and for design:true precedent already
    # proven out three times this wave. design: true, so this pass
    # includes an A group. 4 kept + A 1 (an RFC for an autonomous ops
    # agent with unscoped shell access, no autonomy bounds or approval
    # gates, no audit trail, and no rollback plan for the agent design
    # itself -- exercises the shared decision-record checklist too) + B
    # 5 (per-axis coverage of the five completely-uncovered checks:
    # unpinned MCP servers with tool descriptions trusted verbatim
    # (tool poisoning); model-generated code run via bare exec() in the
    # host process (unsandboxed); an inter-agent message acted on with
    # no origin authentication; a raw, unvalidated, unprovenanced
    # memory write; a handler reaching sensitive data and then posting
    # to a model-supplied URL (lethal-trifecta action leg)) + C 3
    # (delegate/escalate, each grounded in this lens's own documented
    # cross-references: an egress-gated action leg that still combines
    # the other two trifecta legs -> reviewing-llm-integration per "#25
    # owns the trifecta framing, #32 owns the mitigation"; a
    # well-logged, well-scoped tool call nobody actually monitors ->
    # reviewing-observability-and-operability per "cross #16"; a
    # least-privilege, approval-gated tool with an untyped free-form
    # JSON parameter contract -> reviewing-api-contract-safety per "the
    # tool contract to #13") + D 5 (adversarial: a "sandboxed, fully
    # isolated" comment over a real bare exec() in the host process; an
    # in-diff "reviewed and approved by security team" claim over a
    # real unpinned, verbatim-trusted MCP connection; demo-deadline
    # framing ("approval gate can come in a follow-up PR") over a real
    # ungated irreversible delete_account call; an unbounded,
    # ungated transfer_funds agent loop buried as one hunk of six
    # mostly-cosmetic changes; an "all writes are validated and
    # provenance-checked" comment directly contradicted by an
    # unvalidated raw memory-store append beneath it) + E 4 (a
    # sandboxing counterweight to B2, a memory-hygiene counterweight to
    # B4, the not-applicable test matching this lens's own explicit
    # skip clause -- an ordinary model call with no action surface, per
    # "an ordinary model call ... is reviewing-llm-integration's job" --
    # and a tool-metadata counterweight to B1 (a pinned, hash-verified,
    # description-validated MCP server)) = 22 scenarios. See
    # open-questions.md Q21.
    eval_min: 22
    built_from:
      - { category: 32, source: docs/research/cluster-4-runtime.md#32 }

  - name: reviewing-threat-model
    description: >
      Threat-models a system or design for security at design time — enumerates
      what an adversary could do boundary by boundary (STRIDE, trust boundaries,
      data-flow, attack trees, abuse cases) and whether each threat is mitigated,
      rather than pattern-matching existing code for vulnerabilities. Works on a
      design doc or RFC when present, and reconstructs the implied design from the
      code/config when absent. Use when asked for a threat model, a security
      architecture review, an attack-surface review, or "what could go wrong" on a
      system, service, or AI agent app — especially one with tools, autonomy, or
      external/untrusted inputs. Skip when the change is a pure code fix with no
      new trust boundaries, components, or data-flows — diff-time vulnerability
      detection is sweeping-for-security's job.
    picker: >
      Enumerate what an adversary could do, boundary by boundary — STRIDE, trust
      boundaries, abuse cases — and whether each threat is mitigated.
    shape: diff
    design: true
    wave: 4
    # cross_ref intentionally absent: reviewing-threat-model is the sole primary owner of #38.
    # sweeping-for-security (#14) owns diff-time vuln detection; these are complementary, not overlapping.
    built_from:
      - { category: 38, source: docs/research/cluster-4-runtime.md#38 }

  - name: reviewing-ai-authored-code
    description: >
      Reviews a change for the failure signature of AI-/machine-authored code,
      independent of who wrote it: hallucinated or typosquatted dependencies
      (slopsquatting), invented or misused APIs and parameters, plausible-but-wrong
      constants and logic that reads fluently, hallucinated internal references to
      symbols that don't exist here, over-helpful unrequested additions (scope
      creep as a generation artifact), the weak-default security signature, tests
      that assert the implementation instead of the spec, fabricated
      comments/citations, and duplication instead of reuse. Flags the signature and
      hands the deep verdict to the owning lens (#18 supply-chain, #14 security, #1
      correctness, #11 restraint). Use when reviewing AI-generated or AI-assisted
      code, a large or unfamiliar diff, or any change that adds dependencies or
      confident-looking constants and APIs — the defects are attribution-agnostic,
      so you need not know a model wrote it.
    picker: >
      Does this carry the AI-authored failure signature? Hallucinated/typosquatted
      packages, invented APIs, confident-but-wrong constants, over-helpful scope.
    shape: diff
    wave: 5
    cross_ref: [18]   # primary owner: auditing-dependencies-and-supply-chain
    # Q21: picked for the widest scope-to-coverage gap remaining among the
    # unhardened preference-tier lenses — 18 owned checks (9 under #34, this
    # lens's own AI-authorship-signature territory; 9 under #18, shared with
    # auditing-dependencies-and-supply-chain) on only 4 baseline scenarios.
    # Deliberately does NOT build a parallel B-axis sweep of #18's 9 checks —
    # auditing-dependencies-and-supply-chain's own hardened 22-scenario suite
    # already covers necessary/healthy/CVEs/pinning/transitive-dup/license/
    # malicious-install/automated-updates/version-bump/vendor-lock-in from
    # that category's primary-owner angle, and duplicating it here would
    # violate G1's single-owner principle for no added signal. No design-doc
    # (A) group — shape: diff, not design-capable. 4 originals + B 4 (per-axis
    # coverage of #34's remaining untested checks: hallucinated internal
    # references, confident-but-wrong API misuse distinct from constants, a
    # fabricated internal-issue citation, a real-but-freshly-registered
    # unvetted dependency) + C 4 (this lens's unusually large routing surface
    # — the two baseline scenarios already exercise the #18 and restraint
    # delegate boundaries, so C adds the remaining four: security-weakness
    # signature → sweeping-for-security, a generated test asserting the
    # implementation's own bug → reviewing-test-quality, duplication instead
    # of reuse → checking-idioms-and-consistency, plausible-but-wrong
    # inverted-condition logic → tracing-correctness-and-invariants) + D 5
    # (adversarial: a confident "verified against the docs" claim over an
    # invented parameter, a distractor-buried hallucinated env var among nine
    # correct ones, urgency/already-reviewed framing over a real
    # publicly-readable S3 object ACL, a "standard template, low scrutiny"
    # framing over real duplication, a fake "security review passed" claim
    # over a real weak session-ID generator) + E 3 (a large but genuinely
    # correct diff, a vague-but-true comment correctly not flagged as
    # fabricated, the not-applicable test) = 20 scenarios. See
    # open-questions.md Q21.
    eval_min: 20
    built_from:
      - { category: 34, source: docs/research/cluster-4-runtime.md#34 }
      - { category: 18, source: docs/research/cluster-5-verification.md#18 }

  - name: reviewing-agent-legibility
    description: >
      Reviews a change for agent-legibility — whether an AI agent can understand,
      navigate, and safely modify this code within a context budget. The mirror of
      reviewing-ai-authored-code (quality of code *for* AI readers, not *by* them):
      context economy and self-containment (a depth-first slice understandable
      without loading the whole repo — the "40% context rule"), retrieval-friendly
      and AST-navigable structure, local self-explanation at the edit site,
      agent-onboarding files (AGENTS.md / CLAUDE.md) present, accurate, and scoped
      with do-not-touch guardrails, an llms.txt-style index for agent-consumed
      repos, and no agent-hostile patterns (context-budget-blowing megafiles,
      bloated scaffolding, duplicated parallel copies). Use when reviewing a change
      to an AI-/agent-maintained codebase, to agent-onboarding files or repo
      structure an agent must navigate, or any large or scattered change whose
      context economy matters. Defers human readability to #5–#8, agent-operator
      parity to #24, and runtime tool-safety to #32.
    picker: >
      Can an AI agent read, navigate, and safely change this within a context
      budget? Context economy, retrieval-friendly structure, scoped
      AGENTS.md/CLAUDE.md.
    shape: diff
    wave: 5
    # Q21: fresh scope-to-coverage recompute after reviewing-agentic-safety
    # shipped (PR #262). Two-way tie at the widest remaining gap with
    # reviewing-ethical-design (both 9 owned checks / 4 baseline
    # scenarios); picked this one as the technically lower-risk of the
    # two and a natural continuation of the prior pick's agent-tooling
    # theme. shape: diff, not design-capable, so no A group (precedent:
    # checking-idioms-and-consistency). 4 kept + B 5 (per-axis coverage
    # of the five completely-uncovered checks: retrieval-friendly
    # placement -- refund logic buried in a grab-bag utils file; local
    # self-explanation -- a non-obvious operational constant whose
    # rationale lives only in a commit message, not at the edit site;
    # LLM-centric readability -- four individually-simple functions
    # whose actual behavior only resolves after tracing all of them;
    # scoped guardrails -- an accurate AGENTS.md that never names a new
    # generated directory as off-limits; llms.txt-style index -- an SDK
    # marketed for AI-assistant consumption with no machine-readable
    # entry-point map) + C 3 (delegate/escalate, each grounded in this
    # lens's own heuristics.md cross-references: a locally-present
    # comment that states what rather than why -> reviewing-naming-
    # and-readability per "distinct from #7's human 'why-not-what'"; a
    # fourth near-identical parallel implementation, this diff's own
    # legibility regression, with the repo-wide accumulating-pattern
    # judgment routed to finding-maintainability-hotspots per "xref #21
    # change-amplification"; an accurate, well-scoped AGENTS.md that
    # directly contradicts README.md on the test command and a version
    # requirement -> auditing-documentation-health, #22's documented
    # primary owner (per reviewing-pr-and-process-hygiene's own
    # `cross_ref: [22]` annotation a few entries below)) + D 5 (adversarial:
    # a "no context needed, fully self-explanatory" comment over a
    # genuinely four-module-deep read; an "AGENTS.md was already
    # updated in a separate PR" claim contradicted by the actual branch
    # content; launch-deadline framing over a new 8,400-line vendored
    # megafile; a stringly-keyed registry buried as one hunk of a
    # six-hunk mostly-cosmetic diff; a "fully documented inline" /
    # locking claim contradicted by code that acquires no lock at all)
    # + E 4 (a retrieval-friendly counterweight to B1, a guarded-
    # generated-directory counterweight to B4, the not-applicable test,
    # a trivial one-line function needing no ceremony) = 21 scenarios.
    # See open-questions.md Q21.
    eval_min: 21
    built_from:
      - { category: 35, source: docs/research/cluster-2-readability.md#35 }

  - name: reviewing-ethical-design
    description: >
      Reviews a change for diff-visible, code-level ethical / responsible-design
      defects — the non-ML analog of harmful-output review, a sibling of security
      (harm to the user/subject, not via an attacker): dark patterns and deceptive
      flows (sneaking, fabricated urgency/scarcity, misdirection/confirmshaming,
      obstruction, forced action, nagging), manipulative defaults and asymmetric
      choices (pre-checked consent, opt-out harder than opt-in, auto-renew),
      discriminatory business logic in plain conditionals (a hardcoded threshold or
      proxy disadvantaging a group, no model in sight), dishonest state/signals,
      and consent theater. Strictly detect-and-route: name the pattern with
      evidence, then route the decision — consent-as-law to #27/legal, product
      trade-offs to product, a11y mechanics to #23. Use when reviewing
      consent/opt-out flows, defaults, pricing/eligibility conditionals, or
      onboarding/checkout/cancellation funnels. Skip internal code with no
      user-facing behavior; deep model-fairness auditing is out of scope.
    picker: >
      Does this manipulate or disadvantage the user? Dark patterns, manipulative
      defaults, discriminatory conditionals — detect-and-route to product/legal.
    shape: diff
    wave: 5
    # Q21: fresh scope-to-coverage recompute after reviewing-agent-
    # legibility shipped (PR #264). Its earlier tie partner is now
    # hardened, leaving this lens alone at the widest remaining gap (9
    # owned checks / 4 baseline scenarios). shape: diff, not
    # design-capable, so no A group. 4 kept + B 5 (per-axis coverage of
    # the five completely-uncovered checks: honest state/truthful
    # signals -- a "permanently deleted" claim over a soft-delete-only
    # implementation; consent theater -- a stored consent flag never
    # checked before sending; coercion/pressure -- an hourly-recurring
    # upgrade interstitial with no permanent dismiss; vulnerable-user
    # context -- an undisclosed-odds loot-box mechanic applied
    # identically to minors; accessibility-as-exclusion -- a
    # keyboard-inoperable cancel control next to a fully accessible
    # keep-subscription button) + C 3 (delegate/escalate, each grounded
    # in this lens's own documented routing boundaries: a legitimately
    # protective delete-confirmation that's a bare unauthenticated GET
    # -> sweeping-for-security per "route the protective-control side
    # to #14"; a correct opt-out default undermined by a missing
    # under-13 age gate -> auditing-compliance-and-provenance (#27), a
    # distinct regulatory facet from the consent-as-law delegate the 4
    # originals already exercise; a contrast-hidden (not
    # keyboard-inoperable) cancel control -> reviewing-accessibility-
    # and-i18n (#23), a second, distinct instance of the a11y-mechanics
    # boundary from B5's own operability instance) + D 5 (adversarial:
    # a "legal reviewed and approved" claim over a real manipulative
    # default; an implausible single-ticket justification over a
    # platform-wide nagging pattern; price-increase-week urgency
    # framing over a real obstruction (cancellation moved phone-only);
    # a pre-checked consent default with no decline option buried as
    # one hunk of a six-hunk mostly-cosmetic diff; a "fully transparent
    # pricing" claim contradicted by fees applied only after checkout
    # is rendered) + E 4 (a consent-theater counterweight to B2, a
    # vulnerable-user counterweight to B4, the not-applicable test
    # matching this lens's own explicit skip clause verbatim, a
    # trivial honest low-stakes display needing no ceremony) = 21
    # scenarios. See open-questions.md Q21.
    eval_min: 21
    built_from:
      - { category: 36, source: docs/research/cluster-4-runtime.md#36 }

  - name: reviewing-usability-and-interaction
    description: >
      Reviews a user-facing change for interaction quality — whether a person can
      tell what is happening, do what they came to do, and recover when it goes
      wrong. Grounded in Nielsen's 10 usability heuristics: state completeness
      (an async read produces loading, empty, and error states whether or not
      anyone designed them), reversibility of destructive actions (undo, or a
      confirmation naming what is lost — never a bare "Are you sure?"),
      system-status feedback, error recovery that preserves the user's input,
      controllability (no undismissable modal, no wizard without a back), and
      conformity with the expectations this product already set. Use when
      reviewing a form, wizard, destructive action, async operation, or any
      user-facing flow or screen. Detect-and-route: an unhandled state or an
      unrecoverable action is a defect; which pattern and which words route to
      design. Skip when the change has no user-facing surface. Accessibility
      mechanics are #23's, measured performance #15's, manipulative design
      #36's.
    picker: >
      Can a person use this? Undesigned loading/empty/error states, destructive
      actions with no way back, silent operations, errors that eat the form.
    shape: diff
    design: true
    wave: 6
    built_from:
      - { category: 42, source: docs/research/cluster-7-product.md#42 }

  - name: reviewing-outcome-instrumentation
    description: >
      Reviews whether a change that claims a user or business benefit can be
      told to have worked — the question no other lens asks. Is an outcome
      stated rather than only an output; does the instrumentation that would
      observe it ship in the same diff (deferred tracking leaves the feature
      live and permanently unmeasured); does the hypothesis have a losing
      condition; does an experiment declare guardrail metrics and not only a win
      condition; are assignment and exposure logged where the user actually sees
      the variant; do new analytics events match the tracking plan the rest of
      the org reads; does a rollout flag have an owner and an end condition; and
      has a proxy metric quietly become the target. Use when reviewing a new
      feature, an experiment or flagged rollout, an analytics/telemetry event
      change, or a PR claiming a user or business benefit. Refactors, fixes,
      bumps, and internal work owe no hypothesis — skip them. Which outcome to
      chase routes to product; whether it is observable at all is engineering's.
    picker: >
      After this ships, how would anyone know it worked? Stated outcome,
      instrumentation in the same diff, a losing condition, experiment guardrails.
    shape: diff
    design: true
    wave: 6
    # Q21: continuing the preference-tier rollout after
    # `auditing-data-pipeline-health` merged (PR #270). Widest gap among the
    # remaining lenses fitting the established A-E pattern (11 owned checks
    # against 10 baseline scenarios) — `reviewing-threat-model` (already at
    # 21 scenarios natively, missing only its `eval_min` floor) and
    # `reviewing-artifact-conventions` (`shape: artifact`, a taxonomy not yet
    # adapted) set aside for the same reasons as the prior recomputes. The
    # 10-scenario baseline was unusually rich already, covering 10 of 11
    # checklist bullets well — leaving concrete assignment/exposure code
    # defects (the baseline's guardrails scenario asks to see the code
    # rather than being given a real bug in it) as the one clean B-group gap,
    # and `design: true` had never been exercised at all despite the lens
    # being design-capable — no A-group scenario existed.
    #
    # A (1): an adoption RFC for a dynamic-pricing engine — exercises both a
    # topical gap (a direction-only hypothesis with no magnitude/horizon/
    # losing-condition, no guardrails, no instrumentation plan) and the
    # shared decision-record checklist (alternatives not actually weighed,
    # no revisit-trigger) in one finding set. B (1, per-axis coverage): a
    # concrete assignment/exposure code-defect scenario (session-id hashing
    # instead of user-id, exposure logged before a redirect check) — a code
    # property checked directly, distinct from the kept baseline's
    # ask-to-see-the-code framing. C (3, delegate/escalate): a dedicated
    # PII-in-event-properties scenario routed to
    # auditing-compliance-and-provenance (#27, distinct from the kept
    # baseline's tracking-plan-conformance case); a fresh Goodhart/proxy
    # instance (a streak mechanic) routed to reviewing-ethical-design (#36,
    # a second instance distinct from the kept baseline's autoplay case); a
    # breaking event rename mid-measurement routed to
    # reviewing-data-transformations-and-contracts (#40, a second instance
    # distinct from the kept baseline's simple new-event case). D (5,
    # adversarial): claim-capture, an in-diff suppression comment, board-
    # demo deadline framing over missing guardrails, a distractor-buried
    # uninstrumented feature in a six-file diff, and a PR claim contradicted
    # by the actual code path it describes. E (3, precision): a counterweight
    # to the new B-group case (assignment/exposure done correctly), a second,
    # rarer "No findings" shape distinct from the kept baseline's skip case
    # — a change that makes a real claim and passes every applicable check —
    # and a trivial instrumentation-only addition owing no hypothesis.
    # = 23 scenarios. See open-questions.md Q21.
    eval_min: 23
    built_from:
      - { category: 43, source: docs/research/cluster-7-product.md#43 }

  - name: reviewing-conceptual-integrity
    description: >
      Reviews whether a change fits one coherent model of what the product is —
      Brooks's conceptual integrity, the product counterweight to sprawl. Checks
      for a new user-facing concept duplicating one the product already has (two
      nouns for one idea), a second path to a job it already does, a rule it
      already enforces that this change breaks without saying so, one term with
      two meanings across UI copy/docs/API fields, a special case carved into a
