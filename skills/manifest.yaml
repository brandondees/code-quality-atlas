    # (3, per-axis) covers the three checks the 3 originals never exercise as
    # their own standalone defect: declared-vs-live drift (a hand-added
    # security-group rule the plan catches on re-run), encryption-at-rest as
    # an isolated gap (no other axis broken), and policy-as-code for a
    # repeatedly-manual-fixed tag rule. C (3, delegate/escalate), each
    # grounded in this lens's own cross-references in reference/heuristics.md
    # rather than invented: a destructive replace on a stateful resource
    # (this lens's own blast-radius call) with the actual data-migration
    # mechanics routed to reviewing-migration-and-data-safety (cross #20); a
    # pinned-but-CVE'd module (pinning satisfies this lens's own check) with
    # the module's own supply-chain health routed to
    # auditing-dependencies-and-supply-chain (cross #18); a current/required
    # scanner (satisfying tool-currency) with an unscoped wildcard suppression
    # routed to auditing-enforcement-and-meta-artifacts' suppression-hygiene
    # territory (cross #30). D (5, adversarial): a claimed platform-team
    # approval over a real wildcard IAM policy; a partial public-bucket fix
    # buried as item 5 of eight mostly-cosmetic changes; launch-deadline
    # urgency framing over a real public DB ingress rule; a "clean, no
    # drift" summary contradicted by the raw plan output beneath it showing
    # an IAM policy widening to a wildcard; a "verified-registry module,
    # guaranteed secure" claim over a module whose own default leaves an RDS
    # instance publicly accessible. E (4, precision): a resource-free
    # CloudWatch-dashboard-only change needing no ceremony, a deliberately
    # public static-asset bucket scoped and documented as the counterweight
    # to public-exposure findings elsewhere in the suite, a correctly-scoped
    # single-check suppression with a stated reason as C3's counterweight,
    # and the not-applicable test. See open-questions.md Q21.
    eval_min: 20
    built_from:
      - { category: 31, source: docs/research/cluster-5-verification.md#31 }

  - name: reviewing-install-and-upgrade-experience
    description: >
      Reviews a change for the experience of the people who consume this software
      — installing, configuring, and upgrading it — distinct from the
      decision-lifecycle lens's "should we adopt this dependency" call and from
      end-user product UX. Covers setup friction and undocumented prerequisites;
      configuration ergonomics (safe defaults, schema validation, fail-fast
      actionable errors, backward-compatible keys); and upgrade/migration
      smoothness — especially whether a consumer or a code agent can complete and
      verify the upgrade from the docs alone: a codemod or migration command,
      SemVer-correct breaking-change signaling, deprecation windows over silent
      removals, and a downgrade path. Use when reviewing installers, setup/init
      scripts, packaging, CLI and config surfaces, upgrade or migration guides, or
      release/versioning changes — or anything a downstream project adopts (a
      tool, plugin, template, or library). Skip when the change has no
      consumer-facing install, config, or upgrade surface.
    picker: >
      Can a consumer install, configure, and upgrade this cleanly — even hand it
      to an agent? Setup friction, config UX, version-bump smoothness, migration
      path.
    shape: diff
    design: true
    wave: 4
    # Q21: second wave-3 lens hardened, picked by the same scope-to-coverage
    # criterion as the wave's other picks: 18 owned checks against 4 scenarios
    # (0.222 scenarios per check) was the widest gap left in the wave. Same A-E
    # adversarial taxonomy, raised from D8's 3-scenario baseline (this lens
    # already had 4). See open-questions.md Q21.
    eval_min: 28
    built_from:
      - { category: 33, source: docs/research/cluster-6-evolution.md#33 }

  - name: reviewing-interoperability
    description: >
      Reviews a change for interoperability — whether the code correctly speaks
      the external standards and protocols it claims to (ISO/IEC 25010:2023).
      Consolidates conformance checks scattered across other
      lenses: HTTP semantics (safe/idempotent methods, status codes, conditional
      requests, caching); OAuth 2.0 / OIDC flow correctness (exact redirect_uri,
      state/nonce, PKCE); Semantic Versioning and wire/format back-compat; RFC
      formats (date, URI, email, JSON, CSV); Unicode normalization and encoding
      (NFC, UTF-8, the YAML "Norway" class); cron dialects (POSIX vs. Quartz);
      OpenTelemetry semantic conventions; and co-existence (ports, global state,
      shared paths). Use when a change parses or emits a standard format, calls or
      implements an external protocol or auth flow, versions a published surface,
      or serializes data another system reads. Owns conformance to an external
      standard; defers the contract we author to #13, internal correctness to #4,
      idiom to #8, config to #26. Skip changes with no boundary-crossing standard.
    picker: >
      Does the code correctly speak external standards? HTTP/OAuth semantics,
      SemVer, RFC date/URI/email formats, Unicode, cron dialects, OTel semconv.
    shape: diff
    wave: 5
    # Q21: continuing the preference-tier rollout after
    # `auditing-decision-record-currency` merged (PR #266). Widest gap among
    # the remaining shape:diff lenses (8 owned checks against 4 baseline
    # scenarios). Not `design: true` — no A group. The 4 original scenarios
    # covered a date-format defect, missing OAuth `state`, a clean
    # idempotent-POST/RFC-3339 case, and a cron-dialect mismatch — leaving
    # 5 of the lens's 8 checks with no standalone coverage. B (5, per-axis
    # coverage): SemVer/back-compat (a breaking rename shipped under a
    # patch bump), encoding/charset/content-negotiation (a declared
    # Content-Type with no charset over a non-ASCII body), time/calendar/
    # locale tags on the wire (a non-IANA tz abbreviation and a
    # non-BCP-47 locale tag, distinct from the date-format axis the
    # originals already cover), OTel semconv (bespoke span-attribute keys
    # instead of the standard names), co-existence (a hardcoded shared
    # lock path). C (3, delegate/escalate), grounded in this lens's own
    # documented defer list ("defers the contract we author to #13,
    # internal correctness to #4, ... config to #26"): a correctly
    # major-bumped breaking change whose field-shape ambiguity routes to
    # reviewing-api-contract-safety (#13); a correctly RFC-3339-formatted
    # timestamp whose wall-clock (non-monotonic) duration measurement
    # routes to tracing-correctness-and-invariants (#4, "monotonic clocks
    # for durations"); a hardcoded-port co-existence finding whose
    # configuration-practice verdict routes to
    # auditing-config-and-build-hygiene (#26). D (5, adversarial):
    # claim-capture, an in-diff suppression note on the OAuth check,
    # demo-deadline framing over a real cron-dialect mismatch, a
    # distractor-buried PUT-idempotency violation in a six-hunk mostly-
    # cosmetic diff, a docstring claim contradicted by the actual
    # single-dialect implementation. E (4, precision): a SemVer
    # counterweight to B1 (correctly major-bumped), a co-existence
    # counterweight to B5 (an env-configurable port), a trivial one-line
    # RFC-3339 helper, and the not-applicable test matching this lens's
    # own explicit skip clause verbatim (a purely internal refactor
    # crossing no boundary). = 21 scenarios. See open-questions.md Q21.
    eval_min: 21
    built_from:
      - { category: 37, source: docs/research/cluster-4-runtime.md#37 }

  - name: reviewing-artifact-conventions
    description: >
      Reviews a standardized non-source artifact against its own published
      "well-formed X" standard rather than as application code — the artifact
      review shape (D15), presence-activated. On detecting a supported artifact it
      loads that artifact's rubric and reviews against it. Supported artifact: a
      SKILL.md / agent-skill definition, reviewed against Anthropic's
      skill-authoring best practices (trigger-rich frontmatter within limits, a
      lean progressive-disclosure body with detail bundled, a single default
      approach, no time-sensitive text, one-level-deep references, eval-first).
      Use when reviewing a SKILL.md or agent-skill definition (or another listed
      authored artifact) against the standard it should follow. Skip when none of
      the listed artifacts are present — ordinary source code is the other lenses'
      job, and this is authoring quality, distinct from doc-drift (#22) and runtime
      agent-safety (#32).
    picker: >
      Is this authored artifact well-formed per its own standard? Detect the
      artifact (e.g. SKILL.md), load its rubric, review against it.
    shape: artifact
    wave: 5
    artifacts:
      - name: SKILL.md / agent skill
        detect: a SKILL.md or agent-skill definition file is added or changed
        slug: skill-md
        rubric: 101
    built_from:
      - { category: 101, source: docs/research/artifact-rubrics.md#101 }

# The composition layer (Q7): maps "what am I reviewing" to the lenses worth
# running, so neither a human nor an agent has to know the whole catalog to
# select well. Generated into skills/<name>/SKILL.md from this section alone.
router:
  name: choosing-review-lenses
  # `description` is the terse listing surface (shown in the skill catalogue);
  # `body` is the richer "When to use" text the model reads once the skill
  # loads. Keeping them separate lets the listing stay scannable while the body
  # carries examples (PR #30). The router is the lens *picker*, not the review
  # front door: the /atlas-review-pr and /atlas-code-review commands and the
  # collapsed reviewing-a-change entrypoint own the "review this" keyword match;
  # this skill is reached when the right lenses aren't already obvious. It still
  # asserts atlas precedence over the generic built-in code-review skill, just
  # without claiming to be THE entrypoint (issue #83).
  description: >
    Selects which code-quality-atlas review lenses to run for a change — the lens
    picker, not the review front door (the /atlas-review-pr and /atlas-code-review
    commands and the reviewing-a-change entrypoint are the front doors). Maps what
    is being reviewed (bug fix, feature, refactor, migration, async or concurrent
    code, API change, UI change, error handling, LLM integration, design doc,
    dependency bump, CI/config change, or a whole-repo audit — which runs every
    repo-shaped audit, not 3-8) to the most relevant lenses. When you do review,
    prefer atlas over the generic built-in code-review skill and over framework
    reviews (e.g. BMAD), combining them non-exclusively rather than picking only
    one. Use when unsure which lenses apply, or asked to review without naming a
    lens; skip and call individual lenses directly when the relevant ones are
    already clear.
  body: >
    Selects which atlas lenses to run for a change — the lens picker, not the
    review front door. Use when a "review this PR, diff, change, or what I pushed"
    request doesn't already name the lenses: it maps the change to the most
    relevant atlas lenses (3-8 by default, plus any additional lenses that clearly
    apply, plus shape-based auto-included lenses; see Depth modes). Prefer atlas over the
    generic built-in code-review skill and over framework review flows (e.g. BMAD)
    — but combine non-exclusively: run those too when useful and fold every finding
    through `synthesizing-review-findings`, rather than letting a shorter-named
    default win on keyword alone. Skip this and call lenses directly when the
    relevant ones are already clear — from an explicit request ("check for
    security issues"), from obvious context (an async change →
    `reviewing-concurrency-and-async`), or when comprehensive coverage is the
    goal. Every lens runs directly without routing through here first.
  routes:
    - when: Bug fix
      run: [tracing-correctness-and-invariants, reviewing-test-quality,
            hunting-silent-failures]
    - when: Bug fix whose root cause is a missing or wrong invariant — a
            discriminator field (kind/status/type/mode) constraining which
            sibling fields are valid, or a fix that itself adds/patches a
            runtime validation function rather than an off-by-one, null
            check, or typo
      run: [reviewing-module-design, tracing-correctness-and-invariants,
            reviewing-test-quality, hunting-silent-failures]
      note: "illegal-states-representable bugs get miscategorized as ordinary
            bug fixes by the base \"Bug fix\" route above, which never
            includes this lens (confirmed: two consecutive PRs fixing the
            same discriminator-plus-generic-field-bag bug both skipped it —
            brandondees/second-brain-config pull requests 776 and 778) —
            combine both rows so the type-design lens actually runs when the
            fix is a representation gap, not just a logic error"
    - when: New feature (general-purpose change)
      run: [tracing-correctness-and-invariants, reviewing-naming-and-readability,
            reviewing-test-quality, checking-restraint]
    - when: Refactor / restructuring
      run: [reviewing-module-design, checking-restraint,
            checking-idioms-and-consistency, reviewing-naming-and-readability]
    - when: Schema migration, backfill, or data-format change
      run: [reviewing-migration-and-data-safety, tracing-correctness-and-invariants,
            hunting-silent-failures]
    - when: Data-plane change — a SQL or dbt/SQLMesh model, a warehouse or
            ETL/ELT transformation, an event or analytics schema, a data test
            or expectation suite, or a producer of data another team consumes
      run: [reviewing-data-transformations-and-contracts,
            tracing-correctness-and-invariants, hunting-silent-failures,
            reviewing-migration-and-data-safety]
      note: "the analytics plane — grain and fan-out, SQL NULL semantics,
            incremental idempotency, data-test adequacy, and consumer
            compatibility; #20 owns the operational store's migration
            mechanics, #13 the service API contract, #27 the PII verdict.
            hunting-silent-failures rides along because #40's fail-loud-not-empty
            check delegates its verdict to #2 — a pipeline that publishes an
            empty or stale table on a missing source is a silent-failure defect,
            so the owning lens must actually be in the route"
    - when: Async / concurrent / distributed change (queues, workers, locks, await)
      run: [reviewing-concurrency-and-async, tracing-correctness-and-invariants,
            hunting-silent-failures]
    - when: Public API or contract change (endpoints, SDK surface, webhooks)
      run: [reviewing-api-contract-safety, reviewing-module-design,
            sweeping-for-security]
    - when: New abstraction, library, or engine shipped ahead of its consumer
            (generic/trait with one or no impl, a crate with no caller yet,
            "substrate for a later feature")
      run: [checking-restraint, reviewing-module-design,
            reviewing-api-contract-safety, reviewing-test-quality]
      note: restraint-led — speculative generality can be flawless and premature
            at once, so it hides from the correctness and test lenses
    - when: Error-handling / resilience change (retries, fallbacks, timeouts)
      run: [hunting-silent-failures, reviewing-observability-and-operability,
            reviewing-concurrency-and-async]
    - when: Resilience / scalability / capacity / DR design (a new queue or cache,
            a stateful service, failover/HA, a scaling or capacity plan, or a call
            to a dependency that can be slow or down)
      run: [reviewing-resilience-and-scalability, reviewing-concurrency-and-async,
            reviewing-observability-and-operability]
      note: "design-time operability — blast radius, backpressure, statelessness,
            RTO/RPO; pairs with #16 for the runtime-instrumentation side"
    - when: UI / frontend change (components, templates, user-facing text)
      run: [reviewing-usability-and-interaction, reviewing-accessibility-and-i18n,
            checking-idioms-and-consistency, reviewing-naming-and-readability,
            reviewing-conceptual-integrity]
      note: "#42 leads on a UI change because the defect it owns — a state the code
            reaches with nothing rendered for it — is invisible to the other three:
            #23 checks the markup that exists, #8 whether it matches the codebase,
            #5-#8 whether it reads well. None of them notices the error branch nobody
            designed"
    - when: A change introducing a user-facing concept — a new entity, mode,
            status, container, page, command, endpoint, setting, term, or event
            name a user or an API consumer has to learn, see, or use (whether or
            not there is an existing one to choose between)
      run: [reviewing-conceptual-integrity, checking-restraint,
            reviewing-usability-and-interaction]
      note: "#44 and #11 usually agree here and answer different questions —
            restraint asks whether to build it, #44 whether the product still
            says one thing once it exists. A small, well-scoped, explicitly
            requested change clears restraint and can still leave the product
            with two nouns for one idea, which is why the counterweight has to
            run on ordinary feature PRs and not only at design review"
    - when: Auth, user input, or anything handling untrusted data
      run: [sweeping-for-security, hunting-silent-failures,
            tracing-correctness-and-invariants]
    - when: Performance-motivated change ("this makes it faster")
      run: [reviewing-performance-and-efficiency, checking-restraint,
            tracing-correctness-and-invariants]
    - when: LLM / model-API integration (a model call, prompt construction, or
            model-output handling — no tools or autonomous loop)
      run: [reviewing-llm-integration, sweeping-for-security, checking-restraint]
    - when: Agent / tool-use change — a tool or function definition exposed to a
            model, an MCP server or client, an autonomous or multi-agent loop,
            agent memory, or any code that lets a model take actions
      run: [reviewing-agentic-safety, reviewing-llm-integration,
            sweeping-for-security]
      note: "the action/tool surface (what the model may *do*) — #32 owns it; the
            model call itself is #25, the authz verdict #14"
    - when: Threat model / security-architecture review (a system or AI agent app,
            with or without a design doc)
      run: [reviewing-threat-model, sweeping-for-security, reviewing-agentic-safety,
            reviewing-llm-integration]
      note: "enumeration-led — #38 builds the model and delegates the deep verdict to
            the topical security lenses"
      shapes: [diff, decision]
    - when: AI-generated or AI-assisted change, a large or unfamiliar diff, or any
            change that adds dependencies or confident-looking constants/APIs
      run: [reviewing-ai-authored-code, tracing-correctness-and-invariants,
            sweeping-for-security]
      note: "attribution-agnostic; #18 owns the supply-chain verdict, #14 the
            security one"
    - when: Change to an AI-/agent-maintained codebase, to agent-onboarding files
            (AGENTS.md/CLAUDE.md, llms.txt) or repo structure an agent must
            navigate, or a large/scattered change whose context economy matters
      run: [reviewing-agent-legibility, reviewing-naming-and-readability,
            checking-restraint]
      note: "the agent-as-reader vantage — mirror of #34; context economy,
            retrieval-friendly structure, scoped agent onboarding"
    - when: User-facing flow that could manipulate or disadvantage a person —
            consent / opt-out, defaults, pricing or eligibility conditionals,
            onboarding / checkout / cancellation funnels
      run: [reviewing-ethical-design, reviewing-accessibility-and-i18n,
            sweeping-for-security]
      note: "detect-and-route — dark patterns, manipulative defaults,
            discriminatory conditionals; consent-as-law routes to #27, product
            trade-offs to product, a11y mechanics to #23"
    - when: A user-facing flow with states or consequences — a form or wizard, a
            destructive or irreversible action (delete, revoke, overwrite, cancel),
            an async operation the user waits on, or a screen that can be empty or
            error out
      run: [reviewing-usability-and-interaction, reviewing-accessibility-and-i18n,
            hunting-silent-failures, reviewing-ethical-design]
      note: "the user's side of the flow — undesigned loading/empty/error states,
            destructive actions with no way back, errors that discard the user's
            input; hunting-silent-failures rides along because the same swallowed
            error is both a silent failure in the code and an unhandled state on the
            screen, and reviewing-ethical-design because friction that benefits
            someone is #36's, friction that benefits nobody is #42's"
    - when: A change that claims a user or business benefit — a new user-facing
            feature, an experiment or feature-flagged rollout, a PR description
            promising an outcome, or an analytics/telemetry change that instruments
            one of those (not a telemetry-schema or operational-metric change on its
            own, which claims nothing about a user)
      run: [reviewing-outcome-instrumentation, reviewing-pr-and-process-hygiene,
            reviewing-observability-and-operability]
      note: "will anyone be able to tell whether it worked — a stated outcome,
            instrumentation in this diff rather than a follow-up, a losing condition,
            and guardrails alongside the win metric. #24 owns whether the PR's claims
            about the *diff* hold up, #16 whether the thing can be operated; a change
            can be fully observable and completely unmeasured. Skip on refactors,
            fixes, and bumps, which owe no hypothesis"
    - when: Logging, metrics, alerts, feature flags, deploy/rollback paths
      run: [reviewing-observability-and-operability, sweeping-for-security]
    - when: Tests-only change
      run: [reviewing-test-quality, checking-idioms-and-consistency]
    - when: Docs-only change (README, `docs/**`, comments)
      run: [reviewing-naming-and-readability]
      note: "auditing-documentation-health auto-includes on this shape too —
            scoped to the changed files, not the whole repo; kept out of this
            row's run list since it is repo-shaped and mixing it with a
            diff-shaped lens here would drop it from the collapsed diff
            entrypoint"
    - when: Design doc / plan / RFC (no code yet)
      run: [tracing-correctness-and-invariants, reviewing-concurrency-and-async,
            reviewing-migration-and-data-safety, reviewing-api-contract-safety,
            reviewing-conceptual-integrity]
      note: pick by the design's domain, from design-capable (◆) lenses only
      shapes: [diff, decision]
    - when: Dependency add or bump
      run: [auditing-dependencies-and-supply-chain, checking-restraint]
    - when: CI / build / config change
      run: [auditing-config-and-build-hygiene, sweeping-for-security]
    - when: Install / setup / packaging change, an upgrade or migration guide, a
            config or CLI surface, or anything a downstream project adopts (a
            tool, plugin, template, or library)
      run: [reviewing-install-and-upgrade-experience, reviewing-api-contract-safety,
            auditing-documentation-health]
      note: the adopter-facing experience — setup friction, config UX, and a
            version-bump a consumer or an agent can complete and verify
    - when: Change that parses or emits a standard format or speaks an external
            protocol — an HTTP/REST client or handler, an OAuth/OIDC or other
            auth flow, date / URL / email / CSV / JSON serialization, a version
            bump on a published surface, a cron expression, or telemetry
            attributes
      run: [reviewing-interoperability, reviewing-api-contract-safety,
            tracing-correctness-and-invariants]
      note: "does the code correctly speak the external standard — HTTP/OAuth
            semantics, RFC formats, SemVer, Unicode, cron dialect, OTel semconv;
            #13 owns the contract we author, #4 internal correctness, #14 the
            auth-flow security verdict"
    - when: Infrastructure-as-code change (Terraform/OpenTofu, Kubernetes/Helm,
            CloudFormation manifests)
      run: [auditing-infrastructure-as-code, sweeping-for-security]
      note: "repo-shaped — judges blast radius, public exposure, IAM scope, and
            declared-vs-live drift; #14 owns the security verdict"
    - when: A standardized authored artifact rather than source code — a SKILL.md
            or agent-skill definition (more artifact rubrics to come)
      run: [reviewing-artifact-conventions]
      note: artifact-shaped — detect the artifact, then review it against its own
            published standard, not as application code
      shapes: [artifact]
    - when: Any pull request (the PR artifact itself, on top of content lenses)
      run: [reviewing-pr-and-process-hygiene]
    - when: Whole-repo health audit (scheduled / cron)
      run: [finding-maintainability-hotspots, auditing-architecture-conformance,
            auditing-dependencies-and-supply-chain, auditing-config-and-build-hygiene,
            auditing-documentation-health, auditing-compliance-and-provenance,
            auditing-enforcement-and-meta-artifacts, auditing-infrastructure-as-code,
            auditing-decision-record-currency, auditing-data-pipeline-health]
      note: the ten repo-shaped audits; run independently, not as one pass
            (auditing-infrastructure-as-code only where IaC manifests exist;
            auditing-decision-record-currency only where a decision-record
            directory exists; auditing-data-pipeline-health only where the repo
            has SQL models, pipelines, data tests, or published data
            schemas — data tests included because a repo can carry
            permanently-warning or disabled ones with no models of its own)
      shapes: [repo]
    - when: Enforcement config — lint/type suppressions, alert rules or dashboards,
            or checked-in generated artifacts
      run: [auditing-enforcement-and-meta-artifacts]
      note: repo-shaped — scans suppression accretion and codegen/monitoring drift
            across the tree, not a single diff
      shapes: [repo]
    - when: A decision, not a diff — an ADR / RFC / design doc, a dependency or
            technology adoption, a build-vs-buy or vendor choice, or a
            deprecation / sunset plan
      run: [reviewing-decision-lifecycle, checking-restraint,
            reviewing-api-contract-safety, reviewing-conceptual-integrity]
      note: "decision-shaped — reviews the choice and its record (rationale,
            assumptions, exit), not implementation code; pair with the
            design-capable (◆) lenses for the decision's domain.
            reviewing-decision-lifecycle auto-includes on this shape even if
            ranking would otherwise drop it"
      shapes: [decision]
    - when: A repository's existing decision-record archive (an ADR/RFC directory
            already on disk), swept on a schedule rather than reviewed as it's
            being authored
      run: [auditing-decision-record-currency]
      note: "repo-shaped — status-graph consistency, revisit-triggers plausibly
            due, EOL adoptions, and orphaned records; #29 owns the authoring-time
            call, this only checks whether time has invalidated an existing one"
      shapes: [repo]

# The evidence pre-pass (G34 Tier 1): between the router picking lenses and the
# lenses running, gather what the repo's *own* deterministic tools already say
# about the change, and hand it to each lens as evidence to confirm,
# contextualize, or dismiss. Enacts the G5 principle the map has stated since
# the first gap hunt but never ran at review time — where a mature linter or
# scanner already covers a category, the lens's job is to triage its output, not
# to re-derive the finding by judgment alone. Generated into
# skills/<name>/SKILL.md from this section alone (built_from: []), exactly like
# the router and synthesizer, and bundled into every collapsed entrypoint as
# reference/tool-evidence.md.
prepass:
  name: grounding-review-in-tool-output
  description: >
    Runs the deterministic linters, type checkers, scanners, and test/coverage
    tools the reviewed repository has *already* configured, scoped to what is
    being reviewed, and turns their raw output into evidence the
    code-quality-atlas lenses confirm, contextualize, or dismiss. Use before the
    lenses run on any review where the repo carries its own tooling — a pull
    request, a local diff, or a whole-repo audit — so findings that a tool can
    prove are grounded in a rule id instead of re-derived by judgment, and so
    the review can state which categories had deterministic coverage and which
    did not. Never installs or introduces a tool the repo has not adopted, and
    never treats a clean tool run as clearing a lens.
  body: >
    Gather deterministic evidence before the lenses judge. Discover which
    linters, type checkers, scanners, and data/infra tools this repository
    already runs, run those (and only those) over the scope under review, and
    hand each lens the hits that fall in its territory. Tool output is an input
    to the review, never a substitute for it: every hit is confirmed,
    contextualized, or dismissed by the owning lens, and every tool that could
    not run becomes a stated coverage limitation rather than a silent pass.
  # Where to look to learn what the repo actually runs. Order matters: the
  # earlier sources say what is *enforced*, the later ones what is merely
  # installed or documented.
  discover:
    - source: The pre-commit config — `.pre-commit-config.yaml`
      tells: >
        the richest single signal — each hook names its tool, its arguments,
        and the file filter it runs under, so it gives scope as well as
        inventory
    - source: CI workflow definitions — `.github/workflows/*.yml` and
        `*.yaml`, `.gitlab-ci.yml`, `Jenkinsfile`, `.circleci/config.yml`
      tells: >
        what the repo actually gates merges on, which is the set worth
        reproducing — a tool configured but not wired into CI is weaker
        evidence that the team stands behind its rules
    - source: Package manifests — `package.json` (scripts, devDependencies),
        `pyproject.toml`, `Gemfile`, `Cargo.toml`, `go.mod`
      tells: which tools are installed and which command name invokes them
    - source: Per-tool config files — `eslint.config.js`, `.eslintrc*`,
        `ruff.toml`, `.rubocop.yml`, `.golangci.yml`, `.semgrep.yml`,
        `.sqlfluff`, `.tflint.hcl`, `sgconfig.yml`
      tells: >
        the repo's own rule selection — always run the tool under its config,
        never under your own defaults, or the output is about a rule set the
        team never chose
    - source: Task runners and contributor docs — `Makefile`, `justfile`,
        `Taskfile.yml`, `CONTRIBUTING.md`, `AGENTS.md`, `CLAUDE.md`
      tells: >
        the documented entry point (`make lint`, `npm run check`), which is
        often a bundle of several tools and is what a human would have run
  # Tool families to look for, what each grounds, and the lens that owns the
  # resulting finding. `grounds` names real lenses and is validated against the
  # manifest, so a renamed lens cannot leave a dangling pointer here.
  families:
    - kind: Lint & style
      tools: ESLint, Ruff, RuboCop, golangci-lint, Clippy, ShellCheck,
        markdownlint-cli2
      grounds: [checking-idioms-and-consistency, reviewing-naming-and-readability]
    - kind: Types & static correctness
      tools: mypy, Pyright, `tsc --noEmit`, `go vet`, Infer
      grounds: [tracing-correctness-and-invariants, hunting-silent-failures]
    - kind: Security & SAST
      tools: Semgrep, Bandit, CodeQL, gosec, Brakeman, gitleaks
      grounds: [sweeping-for-security]
    - kind: Dependency & supply chain
      tools: pip-audit, npm audit, cargo-audit, osv-scanner, Dependabot,
        Syft/Grype
      grounds: [auditing-dependencies-and-supply-chain, reviewing-ai-authored-code]
    - kind: Infrastructure as code
      tools: tflint, Checkov, `terraform validate`, kube-linter, Hadolint
      grounds: [auditing-infrastructure-as-code]
    - kind: Structure & architecture
      tools: dependency-cruiser, import-linter, ArchUnit, madge
      grounds: [auditing-architecture-conformance, reviewing-module-design]
    - kind: Tests & coverage
      tools: the repo's own test runner plus its coverage config (.coveragerc,
        pyproject.toml [tool.coverage], a jest coverageThreshold)
      grounds: [reviewing-test-quality]
    - kind: Accessibility
      tools: axe-core, eslint-plugin-jsx-a11y, Lighthouse CI
      grounds: [reviewing-accessibility-and-i18n]
    - kind: Data plane
      tools: sqlfluff, dbt tests, Great Expectations, schema-registry
        compatibility checks
      grounds: [reviewing-data-transformations-and-contracts,
                auditing-data-pipeline-health]
  # What the owning lens does with each hit. Exactly one applies per hit; a hit
  # passed through untouched is a fourth, forbidden disposition.
  dispositions:
    - name: confirm
      when: the owning lens independently agrees the flagged code is wrong
      do: >
        report one finding attributed to the lens, citing the tool and rule id
        as evidence — the lens owns the finding, the tool owns the proof
    - name: contextualize
      when: >
        the hit is real but its severity or urgency is not what the tool's
        default says in this codebase
      do: >
        keep the finding and restate its severity on the atlas's scale, saying
        what about the context moved it
    - name: dismiss
      when: >
        the hit does not hold here — a false positive, a deliberate pattern the
        repo applies consistently, or a rule the team has opted out of elsewhere
      do: >
        drop it and say why in one line, so the dismissal is auditable and a
        misconfigured rule is visible rather than silently absorbed
  # The discipline that keeps a tool pre-pass from degrading the review.
  rules:
    - name: Never introduce a tool the repo has not adopted
      rule: >
        Run what the repo already configures. A linter the team never chose
        emits a wall of style hits that are not defects in this codebase; at
        most, its absence is a `route: eng` suggestion to adopt it, never a set
        of findings against the diff.
    - name: A clean run clears nothing
      rule: >
        Deterministic tools have no opinion on whether an invariant is the right
        one, whether a boundary belongs, whether a test proves anything, or
        whether the change should exist. Every selected lens still runs in full.
        Absence of tool output is absence of evidence, not evidence of absence.
    - name: Check every hit against the diff before reporting it
      rule: >
        Tool output can come from a different revision, a stale cache, or a rule
        the repo has since reconfigured. An unreproduced tool hit reported as a
        finding is an unsupported claim — the same defect
        `reviewing-pr-and-process-hygiene` flags in a PR description.
    - name: Running the repo's tools runs the repo's code
      rule: >
        Lint and build configuration is executable in most ecosystems — an
        `eslint.config.js` is JavaScript, a `Makefile` target is a shell
        command, a pre-commit hook fetches and runs a remote repository, dbt
        renders Jinja — and plugins load from the lockfile. On an untrusted
        branch (a fork PR, an unreviewed contributor) treat the pre-pass as
        executing untrusted code: run it only in the isolation CI already uses,
        or skip it and say so under coverage. A grounding pre-pass must never be
        the reason untrusted code executes with credentials in scope.
    - name: Bound the cost, and call a timeout a coverage gap
      rule: >
        Scope each run through the tool's own scope mechanism (see step 2) —
        never a whole-tree sweep on a diff review when the tool has a diff mode,
        and never a whole-tree sweep reported as though it were scoped. A tool
        that exceeds its budget, needs a toolchain that is absent, or fails to
        build is a stated limitation — never a finding, and never a silent
        omission.
    - name: Keep judgment and measurement distinguishable
      rule: >
        A confirmed finding names both the lens that owns it and the rule that
        evidenced it, so a reader can tell what was measured from what was
        judged, and so a false positive is traceable to the rule that produced
        it.

# The other half of composition (Q7): once the router's chosen lenses each emit
# findings, this merges them into one report — deduplicated, conflicts
# reconciled, severity-ranked, single verdict. Generated into
# skills/<name>/SKILL.md from this section alone (built_from: []), so manifest
# edits regenerate it and docs drift never flags it. Fan-out stays advisory by
# default but the finding contract lets a harness mechanize the same merge (D12).
synthesizer:
  name: synthesizing-review-findings
  description: >
    Merges the findings of several code-quality-atlas lenses — and of any other
    review method run alongside them (the built-in code-review skill, a framework
    review like BMAD, linter output, or human notes) — into one review:
    deduplicates issues raised by more than one source, reconciles lenses that
    pull opposite ways (e.g. restraint vs. coverage, cache vs. profile), ranks
    by severity, and ends on a single block/approve verdict. Use after running any
    set of atlas review lenses (and any companion reviewers) on a change —
    typically 3-8 in standard review mode, uncapped in comprehensive mode — when
    assembling multi-source review output into one report, or when overlapping
    findings need deduplicating and prioritizing.
  severity_order: [Blocker, Major, Minor, Nit]
  tensions:
    - between: [checking-restraint, reviewing-module-design]
      about: a new abstraction or boundary — one lens brakes, one wants the seam
      resolve: >
        Favor the simplest design the current requirements justify; add the
        boundary only once a second concrete consumer exists. Restraint wins
        until then.
    - between: [checking-restraint, reviewing-performance-and-efficiency]
      about: hand-optimization without a profile
      resolve: >
        No optimization lands without a profile showing the hot path.
        Performance wins only on measured evidence; otherwise keep the simple
        version.
    - between: [checking-restraint, reviewing-test-quality]
      about: how much test coverage is enough
      resolve: >
        Cover the behavior and a regression test for any fixed bug; stop at
        coverage that only pins implementation detail. More tests is not
        automatically better.
    - between: [checking-restraint, reviewing-api-contract-safety]
      about: new validation or surface "to be safe" vs. leaving it out
      resolve: >
        "When in doubt, leave it out" — minimal new public surface wins; add
        validation only on surface that actually ships now.
    - between: [reviewing-performance-and-efficiency, reviewing-naming-and-readability]
      about: a fast but cryptic form vs. a clear but slower one
      resolve: >
        Keep the readable form unless a profile proves the clear version is the
        bottleneck; if the fast form must stay, require a comment explaining why.
    - between: [checking-restraint, reviewing-resilience-and-scalability]
      about: defensive resilience machinery (retries, circuit breakers, multi-region,
        extra replicas) vs. simplicity
      resolve: >
        Add resilience in proportion to the availability/scale target and the
        failure modes the system will actually face; do not engineer for scale or
        failures with no stated requirement. Restraint wins absent an SLO or scale
        target — but a real unbounded queue, missing timeout, or untested restore
        is a correctness/operability defect, not gold-plating, and stands.
    - between: [checking-restraint, reviewing-conceptual-integrity]
      about: whether a change is "too much" versus whether it fits the product's
        existing model
      resolve: >
        Different questions, and they are usually on the same side. Restraint
        asks whether to build this at all; conceptual integrity asks, given that
        it ships, whether the product still says one thing. A small, requested,
        well-scoped change clears restraint and can still add a second noun for
        an existing idea — that finding stands and restraint does not suppress
        it. Where both fire on the same addition they agree: report it once,
        under whichever lens's evidence is concrete, and route the decision.
        Where they genuinely diverge, restraint's "don't build it" is the
        cheaper fix and goes first.
    - between: [reviewing-conceptual-integrity, reviewing-usability-and-interaction]
      about: a second way of doing something — a mechanics mismatch or a model
        mismatch
      resolve: >
        Split by what the user trips on. A control that behaves differently from
        its siblings is #42's: the user trips on it in the moment, and the fix is
        to make it behave like the others. Two concepts covering one job is
        #44's: the user trips on it when choosing between them, and no amount of
        making them behave alike helps. A change can carry both, and then both
        report — but neither restates the other's finding.
    - between: [reviewing-conceptual-integrity, reviewing-api-contract-safety]
      about: an endpoint that is safe and well-formed but invents its own resource
        model
      resolve: >
        #13 owns whether the contract is compatible, paginated, and hard to
        misuse; #44 owns whether it fits the model the rest of the API already
        teaches. A new endpoint can pass every #13 check and still be the second
        way to fetch the same resource. Conversely, matching the house model does
        not excuse an unversioned breaking change. Both stand on their own
        evidence, and neither lens's ownership sets the verdict: rank them by
        the severity each reported, exactly as every other pair is ranked. #13's
        finding is usually the blocking one because #44's is usually routed —
        an observation about the common case, not a rule that outranks a #44
        defect.
    - between: [reviewing-observability-and-operability, auditing-compliance-and-provenance]
      about: how much to log for operability vs. keeping PII and secrets out of logs
      resolve: >
        Log enough to operate and debug, but never PII, secrets, or regulated
        data in the clear — redact or tokenize at the logging boundary. Privacy
        wins on any field that could identify a person; add scrubbed, structured
        fields rather than dropping the observability.
    - between: [sweeping-for-security, reviewing-usability-and-interaction]
      about: protective friction (a confirmation, a re-auth, a rate limit) vs. a flow
        the user can actually complete
      resolve: >
        Friction that defends a real, named threat stands — say which threat, and
        the usability finding becomes a request to make the friction cheaper, not to
        remove it. Friction with no threat behind it is an unconsidered flow and
        #42 wins. Where the trade-off is genuine (how many confirmations, where the
        step sits), surface both readings and route the call to design rather than
        settling it in an engineering review. Distinct from the
        security ↔ ethical-design pair: that one is about friction someone benefits
        from, this one about friction nobody does.
    - between: [checking-restraint, reviewing-usability-and-interaction]
      about: designing a screen for every state vs. not building surfaces nobody hits
      resolve: >
        Handle the states the code can actually reach — if the fetch can fail, the
        error state is reachable and its absence is a defect, not gold-plating.
        Restraint wins on states the code cannot produce and on polish beyond a
        plainly handled state. On a fourth variant of an existing pattern the two
        lenses agree rather than compete: restraint says don't build another one,
        #42 says users were taught the existing one — so the finding still
        surfaces with its evidence and the decision routes to design. Restraint
        never suppresses a consistency finding; it argues against adding surface.
    - between: [checking-restraint, reviewing-outcome-instrumentation]
      about: instrumenting the change vs. adding telemetry and flags nobody reads
      resolve: >
        Instrument the outcome the change actually claims, and nothing else.
        Restraint wins by default on telemetry unrelated to that claim: a refactor
        or bug fix owes no hypothesis, "track everything" is its own failure mode,
        and each event carries cost and a PII surface (#27). Where a claimed benefit
        has no observation at all, name the **smallest missing signal** — often one
        event, sometimes an existing event or dashboard that already covers it, in
        which case there is no finding. The exception is an experiment or rollout:
        assignment and exposure records, the losing condition, the relevant
        guardrails, and flag ownership are what make the result interpretable at
        all, so restraint does not trade them away as surplus telemetry.
    - between: [reviewing-ethical-design, reviewing-outcome-instrumentation]
      about: a metric the change moves vs. whether a reasonable user would have
        chosen the behavior that moves it
      resolve: >
        Goodhart's seam. A win on a proxy metric (clicks, session length, DAU) that
        a reasonable user would not have chosen is not a win — surface both readings
        together, name the proxy and what it stood for, and route the call to
        product. Neither lens adjudicates it: #36 does not veto a shipped metric and
        #43 does not certify one as success. If the mechanism moving the metric is
        itself a dark pattern, that is #36's finding on its own terms and keeps its
        severity.
    - between: [reviewing-performance-and-efficiency, reviewing-accessibility-and-i18n]
      about: a leaner/faster UI vs. accessible markup and assistive-tech support
      resolve: >
        Accessibility is a correctness requirement, not an optimization to trade
        away. Keep the accessible markup and hit the performance target another
        way (lazy-load, code-split, cache). Drop a11y only against a measured
        budget proving no other path exists — which is almost never.
    - between: [checking-restraint, reviewing-install-and-upgrade-experience]
      about: backward-compat shims and deprecation windows for consumers vs.
        removing the old path now
      resolve: >
        Keep the old path working for one deprecation window with a warning that
        names the replacement whenever the project has external consumers; remove
        in place only for internal-only or never-released surface. Consumer
        smoothness wins while real adopters exist; restraint wins when there are
        none.
    - between: [checking-idioms-and-consistency, finding-maintainability-hotspots]
      about: matching the existing pattern vs. changing it to reduce future churn
      resolve: >
        Stay consistent with the established idiom by default; diverge only when
        the current pattern is a demonstrated maintenance hotspot (high
        change-amplification or repeated edits) and the new form measurably lowers
        that cost. Consistency wins until evolvability has evidence.
    - between: [checking-restraint, reviewing-data-transformations-and-contracts]
      about: how much data-test and data-contract ceremony a new model or event
        schema needs
      resolve: >
        Require the tests that pin the model's grain and the columns consumers
        actually read, and a versioned contract only where a real consumer
        outside this change exists; skip blanket per-column expectation suites
        and contract machinery on an internal, single-consumer model. Restraint
        wins on breadth — but a missing grain/uniqueness test on a fanned-out
        join, or a consumer-breaking schema change with no compatibility gate,
        is a defect rather than gold-plating and stands.
    - between: [sweeping-for-security, reviewing-ethical-design]
      about: added friction or a confirmation step — a protective safety control
        vs. manipulative obstruction
      resolve: >
        Keep friction that protects the user or prevents abuse (confirmations on
        destructive or irreversible actions, step-up auth on high-consequence
        operations, a cooling-off period); cut friction that serves the business
        against the user's clear intent (hard-to-cancel, buried opt-out,
        roach-motel flows). Security's protective friction wins; obstruction does
        not — the test is whose interest the friction serves, not its presence.
modes:
  - name: triage
    breadth: >
      the critical tier only — correctness, security, data-safety, and concurrency
    floor: Major
    triggers: [triage, quick review, fast check, pre-merge gate]
    note: >
      A pre-merge gate: run only the critical-tier lenses and report Major and above.
  - name: review
    breadth: >
      the top 3-8 lenses by relevance, plus any additional relevant lenses the
      reviewer judges worthwhile (the default; not a strict cap)
    floor: escalating
    triggers: [review, review this, code review, review this PR, review the diff]
    note: >
      Default per-PR depth: relevance-ranked top-N (3-8) with the round-based
      escalating floor; extend past N when the change's scope genuinely calls
      for another lens.
  - name: comprehensive
    breadth: >
      every relevant lens, uncapped — the full audit set at repo scope
    floor: Nit
    triggers: [thorough, comprehensive, deep review, use all relevant lenses, review everything]
    note: >
      On-demand or scheduled: run all relevant lenses and pin the floor at Nit so
      readability-class and other long-tail findings surface instead of being trimmed.
entrypoints:
  - name: reviewing-a-change
    description: >
      Review a diff, pull request, or code change with the code-quality-atlas
      lenses. Use for "review this PR / diff / change / what I pushed". Ranks the
      relevant diff lenses by relevance and runs them at the chosen depth
      (review = top few; comprehensive = all relevant), then synthesizes one
      verdict. The collapsed, repo-independent entrypoint for change review.
    shapes: [diff]
  - name: auditing-a-repository
    description: >
      Run a whole-repository health audit with the code-quality-atlas repo-shaped
      audits (architecture, dependencies, config/build, docs, compliance,
      enforcement, infrastructure-as-code, decision-record currency,
      data-pipeline health, maintainability hotspots). Use for a scheduled or on-demand repo audit, not
      a single diff. Runs the applicable audits and synthesizes one report.
    shapes: [repo]
  - name: reviewing-a-decision
    description: >
      Review a decision rather than code — an ADR, RFC, design doc, dependency or
      technology adoption, build-vs-buy or vendor choice, or a deprecation/sunset
      plan. Reviews the choice and its record (rationale, lock-in, exit, revisit
      trigger) with the decision lens plus the design-capable lenses for the
      decision's domain.
    shapes: [decision]
    include_design: true
  - name: reviewing-an-artifact
    description: >
      Review a standardized authored artifact against its own published standard
      rather than as application code — e.g. a SKILL.md / agent-skill definition.
      Detects the artifact and applies its rubric. The collapsed entrypoint for
      artifact-shaped review.
    shapes: [artifact]
