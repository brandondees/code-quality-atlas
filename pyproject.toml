# SPDX-License-Identifier: MIT

[project]
# Not a distributable package (no [build-system] table, no release version) --
# `name`/`version` are here only because PEP 621 requires them once [project]
# exists at all (ruff's own pyproject.toml parser enforces this: RUF200). The
# field that actually matters is requires-python -- stated once, machine
# readable, matching ruff's target-version and requirements.txt's pip-compile
# header (both Python 3.12) rather than left implicit or contradicted by the
# "Python 3.11+" claim older plan docs used to carry.
name = "code-quality-atlas"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
# ruff format also reformats fenced Python code blocks inside Markdown by
# default; excluded here because those blocks live in generated files
# (collapsed/**/body.md, regenerated by tooling.cli generate from
# examples.md) and vendored mirrors (.claude/skills/**) whose own
# regeneration/vendoring pipeline -- not ruff -- is the source of truth for
# their content. Formatting policy for example code blocks is a separate,
# undecided question (#380), not a side effect of adding this gate.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Default rule set (E4, E7, E9, F) — see docs/open-questions.md D-series for
# any future decision to broaden this. C901 (mccabe complexity) is one
# addition: a budget, not a rewrite of everything already over it (issue
# #395) — the 5 pre-existing functions above the limit each carry their own
# `# noqa: C901` pointing at #441, which tracks bringing them down. B904
# (raise-without-from-inside-except) is the other: two real misses in
# manifest.py had gone uncaught with only the default rule set (issue #392).
extend-select = ["C901", "B904"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# tests/*.py deliberately interleave imports with the test sections that use
# them (each "--- Task N ---" / "--- Feature ---" comment block imports only
# what it needs, right above it) rather than front-loading everything at the
# top of an already-large file. That's intentional organization, not drift.
"tests/*.py" = ["E402"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# A ratchet, not a target: set below the coverage measured on tooling/ at the
# time this gate was added (94.6%, branch-inclusive) so it can only be raised
# as coverage improves, never silently lowered (issue #395).
fail_under = 94
