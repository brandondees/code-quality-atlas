# Webhook receiver. A second app from the one-off controller in fly.toml,
# which stays a non-service. This file is what `fly deploy -c` releases.
# Runbook: atlas_reviewer/deploy-service.md

app = "atlas-reviewer-service"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "serve"

[http_service]
  internal_port = 8080
  force_https = true
  # Both off, together, on purpose. Fly Proxy's auto-stop would stop the
  # Machine between reviews, and GitHub closes a webhook that waits longer
  # than 10 seconds. A cold start is not bounded under that window.
  auto_stop_machines = "off"
  auto_start_machines = false
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  timeout = "2s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
