name: ci

# No `paths:` filter on the triggers (#339): a path-filtered `on:` trigger
# means the workflow never RUNS at all for a push/PR that touches none of the
# listed paths, which leaves any branch-protection-required check on this
# workflow stuck permanently pending instead of reporting a conclusion --
# success or a fast `skipped` step (which branch protection treats as
# passing) -- never silence. The shape this comment used to describe was one
# `gate` job with per-step gating; the job's median wall clock was ~23
# minutes (Nov 26, 12 latest successful runs), dominated by the parity-key
# liveness anchor suites, so it is split now: one `changes` job computes the
# path filters once, each downstream job gates itself on those outputs, and
# a final aggregator still named `gate` fails if any of them failed or was
# cancelled while a skipped one counts as passing -- which is #339's
# skipped-steps-pass property carried up to job granularity. Inside `lint`
# the steps keep their per-step `if:` gates on top of the job gate, because
# that job's steps still have genuinely disjoint input sets (Python code vs.
# requirements.in/.txt vs. shell scripts vs. Markdown): a single job-level
# gate can't let e.g. markdownlint run on a docs-only change while skipping
# the Python pipeline, without also either pulling every Markdown change
# into the expensive path or dropping Markdown lint coverage entirely -- see
# #339 for the fuller reasoning.
on:
  pull_request:
  push:
    branches: [main]
  # Two path-independent cadences, distinguished downstream by
  # github.event.schedule (event_name is `schedule` for both):
  #
  # Weekly (`0 6 * * 1`): the "dependency vulnerability audit" step in
  # `lint` is path-gated on PRs (only runs when python/requirements
  # changed), so a CVE published against an unchanged pin is never scanned
  # between pushes (#379). This trigger and that step's `if:` (via the
  # `changes` job's outputs) exist so pip-audit runs against main on a
  # fixed cadence regardless of diff.
  #
  # Daily (`30 6 * * *`): the parity-key liveness check (the `liveness`
  # job). It only exercises fixed anchor commits, so most PRs have no
  # reason to pay for it -- but a pytest or dependency release that changes
  # an anchor suite's pass set is environment drift no PR diff carries, and
  # the daily run is what catches it between pushes.
  schedule:
    - cron: "0 6 * * 1"
    - cron: "30 6 * * *"
  workflow_dispatch:

# Superseded pull_request runs are cancelled; push and scheduled runs never
# are. Two platform facts shape this block:
#
# 1. `cancel-in-progress` only governs *running* runs. A concurrency group
#    holds at most one running and one pending run, and a newer run cancels
#    an older *pending* one regardless of the setting -- observed live in
#    this repo: main-push run 44087837195 was cancelled at
#    2026-11-17T23:41:36Z, the same instant run 44181631062's gate job
#    queued behind it. So no wording of this block can promise a recorded
#    run for every commit; the newest head's run is the one that completes.
# 2. `schedule` events resolve to the default branch's ref, so a ref-only
#    group would put pushes and the scheduled runs in the same group -- and by
#    fact 1, any push landing while a scheduled run sat pending behind
#    another run would silently replace it, losing that week's diff-
#    independent pip-audit (#379).
#
# The group therefore carries the event name, separating the scheduled runs
# (weekly pip-audit, daily liveness) from main pushes entirely: a push can
# neither cancel (fact: cancel-in-progress is false for non-PR events) nor
# supersede a pending audit, and within the schedule group consecutive
# scheduled runs can never overlap, so pending-supersession there is
# harmless. Superseded *pending* main pushes being replaced is accepted for
# the same reason: the newest head's result
# is the one that matters, and any head that reaches the front of its group
# still gets a complete, recorded run. PR runs keep the cancel: they are
# far more frequent, superseding one is unambiguous, and a superseded PR
# run's result is worth nothing once the newer head has its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every job below runs on a GitHub-hosted runner (D78). #471's concern --
  # arbitrary fork code executing on this repo's persistent, personally-
  # owned self-hosted hardware, which no in-tree gate could structurally
  # prevent -- dissolves with the hardware: there is no persistent fleet
  # left to expose, and `push`/`schedule` lose their "safe because they
  # can't be forged by a PR branch" rationale for staying behind.
  #
  # What #471's corrected analysis established still holds, unchanged:
  # for plain `pull_request`, GitHub evaluates this workflow file as it
  # exists in the PR's own head (confirmed against GitHub's own
  # "Approving workflow runs from forks" guidance, which would be
  # meaningless if such changes never took effect), so a hostile PR
  # editing THIS `runs-on:` back to a persistent-runner label gets that
  # edit evaluated for its own run -- an editable in-tree condition can
  # never structurally stop the PR that is editing it. Real protection
  # against that needs a mechanism GitHub enforces independently of this
  # file's content (the Settings value "Require approval for all outside
  # collaborators", or a required-reviewers Environment) -- still tracked
  # in #471, still unverifiable from a checkout, and not changed by this
  # file.
  #
  # `ubuntu-latest` is left floating rather than pinned to a dated image:
  # every tool these jobs gate on is version-pinned independently of the
  # runner OS (the hash-pinned requirements.txt, exact-version pip-tools/
  # pip-audit/pip-licenses, and the checksum-verified upstream shellcheck
  # and actionlint tarballs below -- the apt-pin breakage those two
  # replaced was itself caused by coupling to a runner OS archive), so an
  # image refresh changes the VM, not what the gates enforce.
  #
  # Nothing below is arch-specific either way: the only steps that fetch a
  # prebuilt binary are `shellcheck` and `actionlint` in the `lint` job,
  # which already select their asset and checksum from `uname -m` and error
  # loudly on an unrecognized arch rather than downloading the wrong one.
  # Everything else is Python, actions/setup-python (which publishes both
  # arches), or pure-Node actions.

  changes:
    # One shared paths-filter job: every downstream job gates itself on
    # these outputs instead of each re-detecting (and re-paying) the same
    # diff.
    #
    # The schedule special case is folded into the `python`-family outputs
    # rather than repeated as `github.event_name == 'schedule' ||` on every
    # downstream step: on the weekly scheduled audit dorny/paths-filter has
    # no `before` SHA to diff against and falls back to the single last
    # commit, so if that commit happens to touch neither `python` nor
    # `requirements`, the Python pipeline -- including
    # tests/test_session_log_currency.py -- would silently skip on that
    # week's scheduled run, defeating the point of a periodic, diff-
    # independent currency check (CodeRabbit finding on PR #522). Forcing
    # those three outputs true on the weekly cron keeps every audit step
    # running; the `shell`/`markdown`/`workflows` outputs stay
    # filter-faithful because markdownlint, shellcheck and actionlint never
    # had a schedule override in the single-job shape either.
    #
    # The forcing names the weekly cron specifically, not any `schedule`
    # event: the daily liveness schedule (see `on:`) must not turn into a
    # daily full audit, so the filter step itself skips on it and every
    # output stays false -- the daily run exercises only the `liveness` job.
    #
    # pull-requests:read is required by dorny/paths-filter (below) to list a
    # PR's changed files via the GitHub API; push events don't hit that path,
    # but the permission must be granted unconditionally at the job level
    # since job-level `permissions:` replaces rather than merges with the
    # workflow-level default above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || steps.filter.outputs.python == 'true' }}
      requirements: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || steps.filter.outputs.requirements == 'true' }}
      session_log_substantive: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || steps.filter.outputs.session_log_substantive == 'true' }}
      shell: ${{ steps.filter.outputs.shell == 'true' }}
      markdown: ${{ steps.filter.outputs.markdown == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' }}
      liveness: ${{ steps.filter.outputs.liveness == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Four independent outputs, matched to the genuinely disjoint input
      # sets downstream (see the workflow header for why skipped jobs and
      # steps report success rather than silence). `python`/`requirements`
      # jointly gate the whole pip-install-through-generated-tree-check
      # sequence (cheap enough, and interdependent enough via the shared
      # Python env, that splitting them further isn't worth the complexity);
      # `shell` and `markdown` each gate their own single step
      # independently, since shellcheck and markdownlint need no Python
      # setup at all.
      # Skipped on the daily liveness schedule: on a `schedule` event this
      # filter has no `before` SHA to diff against (only the last-commit
      # fallback), and the daily run must not resurrect a full audit from
      # whatever the newest main commit touched -- the weekly audit keeps
      # the fallback behavior, where the outputs-forcing above already
      # makes every audit step run.
      - if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
        name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - "skills/**"
              - "collapsed/**"
              - "tooling/**"
              - "atlas_reviewer/**"
              - "atlas_settings/**"
              - "tests/**"
              - "docs/research/**"
              - "commands/**"
              - "templates/**"
              - "docs/map/**"
              - "hooks/**"
              - ".claude/skills/**"
              - "AGENTS.md"
              - "CLAUDE.md"
              - "README.md"
              - "REVIEW.md"
              - "LICENSE*"
              - ".claude-plugin/plugin.json"
              - ".claude-plugin/marketplace.json"
              - "docs/distribution.md"
              - "docs/install.md"
              - "docs/collapsed-entrypoints-and-depth-modes.md"
              - "docs/review-depth-modes.md"
              - "docs/open-questions.md"
              # tests/test_session_log_currency.py reads this file's own
              # newest header date -- a session-log-only backfill PR (the
              # exact remediation that test asks for) must still run the
              # `tests` step so the fix is actually verified, not silently
              # reported as `skipped` (#513/#516).
              - "docs/session-log.md"
              # Read by 4 tests (test_ack_round_identity_binding.py,
              # test_pr_review_automation_runbook_accuracy.py,
              # test_review_protocol_markers_sync.py,
              # test_review_thread_resolution_scoping.py) that keep this
              # runbook honest against commands/atlas-review-pr.md -- a
              # pre-existing gap in the same class this PR fixes for
              # session-log.md, caught by atlas review round 2 on #522.
              - "docs/runbooks/pr-review-automation.md"
              # The Fly deploy files atlas_reviewer/tests/test_fly_deploy.py
              # parses or reads.
              - "Dockerfile"
              - "fly.toml"
              - ".dockerignore"
              - ".gitignore"
              - "*.py"
              - "pyproject.toml"
              - ".python-version"
              - ".pre-commit-config.yaml"
              - ".github/workflows/ci.yml"
            requirements:
              - "requirements.in"
              - "requirements.txt"
            # tests/test_session_log_currency.py's pull_request gate (#548)
            # reads this to decide whether a PR's own diff could plausibly
            # need a session-log entry. Deliberately NARROWER than `python`
            # above: `python` also answers "does the tests/lint/mypy job need
            # to run at all" and so includes purely mechanical/meta paths
            # (`.github/workflows/ci.yml`, `pyproject.toml`, `.python-version`,
            # `.pre-commit-config.yaml`) that a Dependabot `github-actions`
            # pin bump touches on its own -- reusing `python` verbatim here
            # left exactly that case still failing the gate (atlas review
            # round 1 on #550: a weekly actions-pin bump edits `ci.yml`,
            # which is in `python`, so it still tripped the calendar check).
            # Same list as `python` minus those four mechanical paths.
            session_log_substantive:
              - "skills/**"
              - "collapsed/**"
              - "tooling/**"
              - "atlas_reviewer/**"
              - "atlas_settings/**"
              - "tests/**"
              - "docs/research/**"
              - "commands/**"
              - "templates/**"
              - "docs/map/**"
              - "hooks/**"
              - ".claude/skills/**"
              - "AGENTS.md"
              - "CLAUDE.md"
              - "README.md"
              - "REVIEW.md"
              - "LICENSE*"
              - ".claude-plugin/plugin.json"
              - ".claude-plugin/marketplace.json"
              - "docs/distribution.md"
              - "docs/install.md"
              - "docs/collapsed-entrypoints-and-depth-modes.md"
              - "docs/review-depth-modes.md"
              - "docs/open-questions.md"
              - "docs/session-log.md"
              - "docs/runbooks/pr-review-automation.md"
              - "Dockerfile"
              - "fly.toml"
              - ".dockerignore"
              - ".gitignore"
              - "*.py"
            shell:
              - "tooling/**/*.sh"
              - "hooks/**"
              - "collapsed/hooks/**"
              - "atlas_reviewer/**/*.sh"
              # The whole workflows/ tree, not just ci.yml: actionlint below
              # also shells out to shellcheck for embedded run: scripts in
              # *any* workflow file, so a change to a workflow other than
              # ci.yml must install shellcheck too, not just gate actionlint
              # itself via `workflows:` below (#379).
              - ".github/workflows/**"
            markdown:
              - "**/*.md"
              - ".markdownlint-cli2.jsonc"
              - ".markdownlint-cli2.yaml"
              - ".markdownlint-cli2.cjs"
              - ".markdownlint-cli2.mjs"
              - ".markdownlint.cjs"
              - ".markdownlint.mjs"
              - ".github/workflows/ci.yml"
            # `.github/workflows/ci.yml` above only ever matches itself, so a
            # change anywhere else under `.github/` (a new workflow file, a
            # `dependabot.yml` edit, ...) previously executed zero checks
            # here (#379). This filter covers the whole tree and gates the
            # actionlint step below.
            workflows:
              - ".github/**"
            # The parity-key liveness check only exercises fixed anchor
            # commits -- the anchor suites run inside each anchor's own
            # worktree -- so on a pull request it runs only when something
            # that can change its result changed: the key records and the
            # loader that parses them (parity_key.py plus the package's
            # __init__ in its import chain), the liveness tests and shard
            # selector themselves, the root conftest.py that anchors
            # pytest's rootdir for every suite invocation, pyproject.toml
            # (a [tool.pytest.ini_options] table there would change how the
            # anchor suites are collected), the dependency set the suites
            # run under, and this workflow file (which decides how the
            # check is invoked). Not gated on the rest of atlas_reviewer/**:
            # a change there can only touch liveness by breaking the
            # parity_key import, which the reviewer suite's job fails on in
            # the same push anyway. Always runs on push to main, on either
            # schedule, and on workflow_dispatch -- main and the schedules
            # are where environment drift (a pytest or dependency release
            # changing an anchor suite's pass set) gets caught, since the
            # anchors themselves are fixed. See the `liveness` job.
            liveness:
              - "atlas_reviewer/fixtures/parity-key/**"
              - "atlas_reviewer/liveness/**"
              - "atlas_reviewer/parity_key.py"
              - "atlas_reviewer/__init__.py"
              - "conftest.py"
              - "pyproject.toml"
              - "requirements.in"
              - "requirements.txt"
              - ".github/workflows/ci.yml"

  lint:
    # Everything the old single `gate` job ran except the suites: the
    # dependency audit, lint/format/type check, the offline dry run, the
    # structure gates (eval, drift, generated trees, license, requirements
    # sync), and the non-Python linters.
    #
    # The job-level gate has to cover EVERY trigger class any step inside
    # uses -- `python`/`requirements` for the Python pipeline, and
    # `markdown`/`shell`/`workflows` for markdownlint/shellcheck/actionlint,
    # which are this job alone's responsibility and have no other home: a
    # narrower job gate would skip the whole job on a markdown-only or
    # workflows-only PR, silently dropping that linter from its only
    # remaining trigger (tests/test_ci_job_gates_cover_step_gates.py pins
    # the reachability). The expensive steps keep their per-step `if:` gates
    # because their input sets are genuinely disjoint (see the workflow
    # header) -- a Markdown-only change still gets markdownlint here while
    # the Python-prefixed steps (setup-python, pip install, everything
    # downstream of it) skip.
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.requirements == 'true' ||
      needs.changes.outputs.markdown == 'true' ||
      needs.changes.outputs.shell == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # persist-credentials: false -- this job never pushes anything (read-
      # only lint/test/audit), so there's no reason for the checked-out
      # working tree to retain the job's GITHUB_TOKEN in its git config for
      # the rest of the job. Narrows what a compromised dependency pulled in
      # by the steps below (pip installs, markdownlint-cli2-action) could
      # exfiltrate.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        with:
          python-version: "3.12"
          # Every run lands on a fresh hosted VM (D78) with a cold pip cache,
          # so `cache: 'pip'` buys a real speedup unconditionally. It is
          # arch-safe regardless: setup-python's `pip-cache.ts`
          # `computeKeys()` includes `process.arch` in both the primary and
          # restore keys (verified directly against the pinned SHA's source,
          # #475), so one architecture can never silently restore the other's
          # incompatible wheels.
          cache: 'pip'
      # #366's fresh-venv dance is retired (D78): it existed because the
      # persistent self-hosted runner's shared interpreter accumulated
      # site-packages across jobs, letting an already-installed pin report
      # "Requirement already satisfied" and skip its hash check entirely
      # (reproduced during that audit: ruff preinstalled, a forged hash of 64
      # zeros, exit 0). A per-run hosted VM removes the cross-job
      # accumulation -- but the interpreter this installs into is still the
      # image-baked setup-python tool-cache Python, whose contents GitHub
      # controls, so an image refresh could in principle ship a package
      # matching one of this repo's pins at the pinned version and reopen
      # the same skip. `--ignore-installed` closes that corner
      # unconditionally: pip resolves and downloads every pin regardless of
      # what the interpreter already holds, so every hash is verified on
      # every run. No venv and no $GITHUB_PATH export are needed --
      # setup-python already puts this exact interpreter's pip/python on
      # PATH for every later step (pip-tools, pip-audit, ruff, pytest,
      # tooling.cli included).
      - if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: pip install --require-hashes --ignore-installed -r requirements.txt
      - name: dependency vulnerability audit
        # Also runs on the weekly `schedule` trigger above (#379), independent
        # of the path filter, so a CVE against an unchanged pin doesn't wait
        # for the next python/requirements-touching push to be caught. (The
        # schedule forcing lives in the `changes` job's outputs -- see that
        # job's comment; on the weekly scheduled audit those outputs are
        # true, so this step runs. The daily liveness schedule skips this
        # whole job.)
        #
        # Placed immediately after the hash-verified dependency install --
        # the only thing it needs -- and deliberately ahead of the other
        # schedule-eligible, potentially-failing steps in this fail-fast
        # job: a security scan must run regardless of whether an unrelated
        # later step (an eval, drift or generated-tree failure, say) fails
        # and aborts the rest of the job. Moved here from after
        # `requirements.txt is in
        # sync` (atlas review round 2, PR #522) after #513/#516's fix put a
        # second schedule-eligible, potentially-failing step ahead of it —
        # which would have silently skipped this scan on any quiet week;
        # the split makes the guarantee stronger still, since the suites
        # that could fail now cannot even hold this job's slot.
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: |
          # pip-audit IS the CI vulnerability gate this repo relies on — unlike
          # requirements.txt's deps (hash-pinned, resolved once and committed),
          # an unpinned `pip install pip-audit` re-resolves to whatever is
          # newest on PyPI on every run, so the gate itself isn't reproducible:
          # a scanner-tool release could change what CVEs are flagged (or
          # silently drop advisory coverage) with no diff in this repo to
          # review. Pinned exact-version like pip-tools below, though for a
          # different reason: that pin is about the requirements-check step's
          # own reproducibility (a pip-tools release could change what it
          # resolves), this one is about the vulnerability-audit gate's.
          # Like that pin, Dependabot has no manifest that
          # covers a version pinned inline in a `run:` script (its `pip`
          # ecosystem entry tracks requirements.txt/.in; `github-actions`
          # tracks `uses:` refs) — this pin has no automated freshness path.
          # Revisit trigger: bump manually whenever a new pip-audit release
          # ships, at minimum whenever `mise run audit`/this step starts
          # missing a CVE you'd expect it to catch; consider moving this to a
          # Dependabot-tracked requirements-dev.txt if it drifts noticeably.
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt
      - name: lint (ruff)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: ruff check .
      - name: format (ruff)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: ruff format --check .
      - name: type-check (mypy)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        # Scoped to tooling/, atlas_reviewer/ and atlas_settings/ via
        # pyproject.toml's [tool.mypy] files list -- this repo's fully
        # type-annotated Python packages.
        run: mypy
      - name: reviewer service dry run (offline fixture PR event)
        # The offline provider reviews no file, so the dry run must report
        # incomplete coverage: exit 4 and a non-approving status line (D36).
        # Any other exit, an APPROVE, or complete coverage fails the step.
        # Exit codes: 0 complete and approved or commented, 5 complete and
        # changes requested, 4 coverage incomplete, 2 usage error or review
        # lock held, 3 boundary error.
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: |
          draft="$RUNNER_TEMP/atlas-reviewer-draft.md"
          code=0
          python -m atlas_reviewer --state-dir "$RUNNER_TEMP/atlas-reviewer-state" review --event atlas_reviewer/fixtures/sample-pr/event.json --dry-run > "$draft" || code=$?
          status="$(head -n 1 "$draft")"
          case "$code" in
            0) meaning="coverage complete, approved or commented" ;;
            5) meaning="coverage complete, changes requested" ;;
            4) meaning="coverage incomplete" ;;
            2) meaning="usage error or review lock held" ;;
            3) meaning="boundary error" ;;
            *) meaning="unexpected exit code" ;;
          esac
          echo "exit $code ($meaning); $status"
          test "$code" -eq 4
          grep -q '"coverage_complete": false' <<<"$status"
          ! grep -q '"review_event": "APPROVE"' <<<"$status"
      - name: eval structure (all skills)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: python -m tooling.cli eval
      - name: eval structure (collapsed entrypoints)
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: python -m tooling.cli eval --skills-root collapsed/skills
      - name: provenance drift
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: python -m tooling.cli drift
      - name: Generated trees are in sync
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: |
          python -m tooling.cli generate --manifest skills/manifest.yaml --docs-root . --skills-root skills --collapsed-root collapsed
          ok=1
          # `git diff --exit-code` only sees paths git already tracks — a generator
          # emitting a brand-new file (or leaving one orphaned untracked after a
          # rename) shows up as untracked, not modified, and the plain diff below
          # would report clean. `git add -A -- <path>` stages creations/deletions
          # too, so `git diff --cached` actually sees them (#382).
          git add -A -- skills/ collapsed/
          git diff --cached --exit-code -- skills/    || { git diff --cached --stat -- skills/;    echo "::error::standalone skills/ drifted — regenerate and commit"; ok=0; }
          git diff --cached --exit-code -- collapsed/ || { git diff --cached --stat -- collapsed/; echo "::error::collapsed/ drifted — regenerate and commit"; ok=0; }
          git diff --exit-code -- README.md docs/distribution.md docs/install.md docs/collapsed-entrypoints-and-depth-modes.md docs/review-depth-modes.md .claude-plugin/plugin.json .claude-plugin/marketplace.json || { git diff --stat -- README.md docs/distribution.md docs/install.md docs/collapsed-entrypoints-and-depth-modes.md docs/review-depth-modes.md .claude-plugin/plugin.json .claude-plugin/marketplace.json; echo "::error::documented counts drifted — regenerate and commit"; ok=0; }
          [ "$ok" -eq 1 ]
      - name: license compatibility
        # #472: pip-audit (below) gates CVEs, but nothing previously checked
        # dependency *licenses* against this repo's own MIT + CC BY posture
        # (D11) -- a future requirements.in addition with an incompatible
        # license would merge unnoticed. Allow-list, not a copyleft deny-
        # list: --allow-only fails on anything not explicitly known-
        # compatible, so a license this list has never seen is treated as
        # unproven rather than assumed fine.
        #
        # Exact match, deliberately NOT --partial-match: a first version of
        # this step used --partial-match for convenience (so "MIT" matches
        # "MIT License" etc.), but pip-licenses implements that as a plain
        # case-insensitive substring test of each allow-list entry against
        # the package's *whole* reported license string
        # (case_insensitive_partial_match_set_diff in piplicenses.py) --
        # confirmed directly against the pinned version's source. For a
        # package reporting a single joined multi-license expression (this
        # repo already has one real instance: `packaging` reports
        # "Apache-2.0 OR BSD-2-Clause" as one string, not two), that means a
        # combined "GPL-3.0-only AND BSD-3-Clause" would also match on the
        # "BSD-3-Clause" substring and pass silently -- BSD alone being
        # allowed says nothing about whether the AND'd GPL term is, so
        # substring matching can't tell an "OR" (either term is fine) apart
        # from an "AND" (every term must be) (round-1 review finding,
        # CodeRabbit). Exact match closes this: a package's full reported
        # license string must appear in the allow-list verbatim, so a new
        # combined expression -- AND or OR -- has to be explicitly reviewed
        # and added, not silently pass because one of its terms happens to
        # already be listed. The list below already carries the one
        # legitimate combined string this repo's tree currently produces
        # ("Apache-2.0 OR BSD-2-Clause", both of whose terms are actually
        # allowed) verbatim for exactly this reason.
        #
        # Placement matters: this step must run here, before
        # requirements.txt-is-in-sync/dependency-vulnerability-audit install
        # pip-tools/pip-audit into this same environment, for the identical
        # reason
        # those two steps' own comment below states -- pip-licenses scans
        # every package installed in the interpreter, not just
        # requirements.txt's own tree, so running it after those unpinned
        # CI-only tools land would gate their transitive deps too (caught in
        # CI: pip-audit's own `rich` dependency pulled in typing_extensions,
        # whose license string didn't match this list, on a tool this repo
        # never ships or imports). The list below is exactly the set
        # `pip-licenses` reports for requirements.txt's own dependency tree
        # at this point in the job, verified both locally and against a live
        # CI run before landing here -- extend it deliberately when a new
        # requirements.in addition needs a license already known to be
        # compatible but not yet listed, same revisit-trigger shape as the
        # pip-tools/pip-audit/pip-licenses pins (see D21 in
        # docs/open-questions.md for why all three stay unhashed).
        #
        # "Mozilla Public License 2.0 (MPL 2.0)" added for `pathspec`, a
        # transitive dependency of `mypy` (issue #512): MPL-2.0 is weak,
        # file-level copyleft -- it only obligates redistributing *modified*
        # MPL-covered files under MPL, not code that merely depends on an
        # unmodified MPL package. `pathspec` is a CI-only tool dependency
        # (mypy's own file-matching backend), never imported by or vendored
        # into this repo's MIT-licensed `tooling/` (D11), so it imposes no
        # obligation on this repo's own license. mypy itself (MIT-licensed,
        # widely adopted) ships the identical dependency for the same
        # reason.
        #
        # "Apache-2.0 OR BSD-3-Clause" (`cryptography`) and "MIT-0" (`cffi`)
        # added for `PyJWT[crypto]`, the GitHub App token signer in
        # `atlas_reviewer/` (D25). The first is an OR of two terms this list
        # already allows on their own. MIT-0 is MIT without the attribution
        # clause, strictly more permissive than MIT. Neither is vendored;
        # both are runtime dependencies of the controller only.
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: |
          pip install pip-licenses==5.5.5
          # protobuf 7.36.2 reports the trove classifier "3-Clause BSD License",
          # the same BSD-3-Clause license the allow list names by SPDX id.
          pip-licenses --allow-only="MIT License;MIT;MIT-0;BSD License;BSD-2-Clause;BSD-3-Clause;3-Clause BSD License;Apache Software License;Apache-2.0;Apache 2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;Python Software Foundation License;PSF-2.0;ISC License (ISCL);The Unlicense (Unlicense);Mozilla Public License 2.0 (MPL 2.0)"
      # requirements.txt-is-in-sync and dependency-vulnerability-audit run
      # last among the python-filtered steps, deliberately (#378): both
      # `pip install` an unpinned tool (pip-tools/pip-audit) straight into
      # this job's Python environment, on top of the hash-verified
      # `requirements.txt`
      # install above. Every trusted gate this job runs above them (lint,
      # format, type-check, the dry run, eval structure, drift,
      # generated-tree sync, license compatibility) has already run and
      # passed against the hash-verified install alone by the time either
      # of these unpinned tools lands in the same interpreter.
      - name: requirements.txt is in sync with requirements.in
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: |
          # pip-tools 7.6.0 crashed under pip 26.2 (RequirementCommand's
          # make_requirement_preparer gained a required `allow_editables`
          # kwarg pip-tools 7.6.0 didn't pass) — pip-tools 7.6.1 (2026-08-11)
          # fixed that compatibility, so no pip-version workaround is needed
          # any more; pip-tools alone is pinned exact so this step's own gate
          # stays reproducible. Not hash-verified like requirements.txt's
          # deps — considered and deliberately skipped: it's CI-only tooling,
          # not shipped or imported by this repo's own code, and a
          # hash-pinned requirements-dev.txt for one tool was judged not
          # worth the added Dependabot/maintenance surface.
          pip install pip-tools==7.6.1
          # The committed lockfile is seeded into the check dir, not just the .in.
          # Without it pip-compile resolves from scratch and pins whatever is
          # newest on PyPI *today*, so any upstream release turns every open PR
          # red for a reason unrelated to its diff — that happened on three
          # consecutive PRs (#204/#206/#208, all of them a fresh `ruff`). With the
          # lockfile present, pip-compile keeps existing pins that still satisfy
          # requirements.in, so this step asserts what it is named for
          # (lockfile *consistent with* the .in, hashes genuine, no hand-edits)
          # rather than "the lockfile is the newest possible resolution".
          #
          # What this step does NOT check, stated because a first draft of this
          # comment claimed otherwise: with the lockfile seeded, pip-compile
          # reuses an already-satisfying pinned line *verbatim, hash included*,
          # and only computes hashes for packages it newly resolves. So a
          # hand-edited hash on an already-pinned package survives this diff.
          # `pip install --require-hashes` above catches most of that: it
          # verifies the one artifact pip
          # actually resolves and downloads for this job's platform/Python
          # against the hash(es) listed for it, and exits 1 on any mismatch.
          #
          # #366: what it does NOT do, despite a second draft of this comment
          # claiming otherwise -- is verify every hash in the committed
          # lockfile. A requirement line can list hashes for several
          # platforms' wheels (sdist, manylinux, macOS, Windows, ...), and pip
          # only ever downloads and checks the one it selects for the running
          # job. A forged hash on a wheel this platform never selects passes
          # both this step's diff and that install silently (reproduced with
          # a forged pyyaml hash during the audit). Hash integrity for the
          # platform this job actually runs on is that step's; .in consistency
          # is this one's; cross-platform hash coverage is neither's.
          #
          # Freshness is neither step's, and is already owned twice: Dependabot
          # proposes upgrades weekly as their own PRs, and `pip-audit` below
          # fails on a pin with a known CVE — the question that actually matters
          # about a stale pin. Verified against pip-tools 7.6.0 that this check
          # still fails on a raised .in floor and on a dependency dropped from
          # the .in.
          #
          # 2026-08-26: this step went red on every open PR with zero .in/.txt
          # diff in any of them — pip-compile started emitting `--no-index` in
          # its own regenerated header comment (Python 3.12, pip-tools 7.6.1)
          # where it previously didn't. requirements.in itself is NOT fully
          # pinned (>= floors, e.g. `ruff>=0.16.4`). #378's audit found the
          # comment that used to sit here (blaming a "warm local wheel cache")
          # was wrong: reading piptools.utils.get_compile_command (7.6.1)
          # shows the regenerated header re-includes any option whose
          # *resolved* value differs from that click Option's own hardcoded
          # default -- regardless of whether the CLI, a discovered pip-tools
          # config file, or a `PIP_*`-style environment variable is what
          # actually set it, and regardless of wheel-cache state. A
          # machine-local default for `--no-index` (or any other flag) making
          # the header differ between two otherwise-identical runs is exactly
          # that: an environment difference on the header line, not a
          # resolution difference in the pins below it. Reproduced cold (fresh
          # venv, cleared pip cache) that the header's presence/absence tracks
          # the machine's own pip-tools-visible defaults, not cache warmth.
          #
          # Since the header can legitimately vary by machine for reasons that
          # have nothing to do with requirements.in/.txt actually drifting,
          # this step now diffs only the non-comment lines (#378) -- the
          # pinned packages and hashes, which is what this step exists to
          # verify -- rather than the whole file. The comment lines
          # documenting how the file was produced are informational, not part
          # of the contract this gate checks.
          # $RUNNER_TEMP unconditionally, no ${RUNNER_TEMP:-/tmp} fallback --
          # matching the convention the shellcheck and actionlint steps in
          # this same job already use (#378): GitHub Actions
          # guarantees the var is set on every runner, so a fallback here
          # would only mask it silently going missing rather than failing loudly.
          work="$(mktemp -d "$RUNNER_TEMP/reqcheck.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cp requirements.in requirements.txt "$work"/
          ( cd "$work" && pip-compile --generate-hashes --output-file=requirements.txt requirements.in )
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' "$work/requirements.txt") || {
            echo "::error::requirements.txt is not consistent with requirements.in (or was hand-edited) — recompile with pip-compile --generate-hashes and commit"
            exit 1
          }
      - name: markdownlint
        if: needs.changes.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
      - name: shellcheck
        # workflows is included, not just shell: actionlint (below) is gated
        # on the broader `workflows` filter (.github/**) and shells out to
        # shellcheck for embedded run: scripts in any workflow file -- a
        # change confined to a non-workflow file under .github/ (e.g.
        # .github/dependabot.yml) would set workflows=true/shell=false and
        # run actionlint with shellcheck nowhere on PATH, silently skipping
        # its embedded-script checks (dees-bot round-2 review on #379).
        if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflows == 'true'
        # timeout-minutes is a backstop, not the primary fix: normal runtime here
        # is a few seconds, so 3 minutes only bounds a hang, never a real run.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Installed from the upstream release rather than apt, deliberately.
          #
          # The previous `apt-get install shellcheck=<exact>` pin coupled this
          # gate to whichever shellcheck version the *runner OS archive*
          # happened to carry, and that broke twice in quick succession as the
          # runner moved: 0.9.0-1 exists on ubuntu-24.04 but not on 25.10, and
          # 0.10.0-1 exists on 25.10 but not on 26.04 (which ships 0.11.0-2).
          # Each move failed the job outright with "Version '<x>' was not
          # found" — a CI break caused purely by infrastructure, with no diff
          # in this repo. Re-pinning to each new OS's version would also
          # silently change *which* shellcheck gates this repo every time the
          # host is rebuilt, which is exactly what an exact pin exists to
          # prevent.
          #
          # The upstream tarball decouples the two: the version is pinned by
          # this file (reproducible, and only ever changed deliberately), and
          # it installs identically on any Linux host regardless of distro or
          # release. Checksums are per-arch and verified, matching the
          # pinned-release-plus-checksum pattern used elsewhere in this org's
          # CI. Both arches are listed so the step stays correct on any
          # Linux hosted image, including the arm64 variant.
          #
          # Version is unchanged from the previous pin (0.10.0) — verified
          # again on the current runner that it reports no findings across
          # this repo's scripts, so this is a change of *install mechanism*,
          # not of what the gate enforces.
          version=v0.10.0
          case "$(uname -m)" in
            aarch64|arm64) arch=aarch64; sha=324a7e89de8fa2aed0d0c28f3dab59cf84c6d74264022c00c22af665ed1a09bb ;;
            x86_64|amd64)  arch=x86_64;  sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 ;;
            *) echo "::error::unsupported architecture $(uname -m) for the pinned shellcheck release"; exit 1 ;;
          esac
          curl --connect-timeout 10 --max-time 120 -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.${arch}.tar.xz"
          echo "${sha}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          # $RUNNER_TEMP, not $HOME/.local/bin: a per-run scratch dir. On the
          # old persistent fleet (#378) a $HOME install survived onto every
          # later job's PATH indefinitely; that concern is gone on a per-run
          # VM, but the scratch dir stays because the export to $GITHUB_PATH
          # below is deliberate (actionlint shells out to shellcheck via a
          # bare PATH lookup) and a run-scoped dir keeps what it exports
          # scoped to this run by construction. (The same hedge the
          # require-hashes install above makes for #366 applies: this step
          # doesn't depend on the dir's wiping anyway -- it downloads,
          # checksums, and overwrites the pinned binary unconditionally every
          # run, so a leftover here would just be clobbered, never
          # trusted-as-is.)
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-${version}/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          chmod +x "$RUNNER_TEMP/bin/shellcheck"
          "$RUNNER_TEMP/bin/shellcheck" --version
          # actionlint (below) shells out to `shellcheck` via a bare PATH
          # lookup for embedded run: scripts -- without this, it silently
          # skips that check rather than failing, so the gap wouldn't even
          # show up as red CI (#379).
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # globstar makes `**` recurse into subdirectories, matching what
          # the `shell:` paths-filter above actually promises to cover
          # (`tooling/**/*.sh`, `hooks/**`, `collapsed/hooks/**`) -- the
          # previous one-level-deep globs (tooling/*.sh, hooks/lib/*.sh, ...)
          # silently stopped scanning a script the filter still correctly
          # detected as changed. tests/test_ci_shellcheck_glob_covers_tree.py
          # guards this by asserting these globs match every *.sh file
          # actually present under the three trees.
          #
          # dotglob too: dorny/paths-filter@v4.0.3 sets picomatch's `dot:
          # true` internally (verified against its source), so the `shell:`
          # filter above already matches a dot-prefixed path -- without
          # dotglob, a hidden .sh file would correctly trigger this step via
          # the filter and then be silently skipped by these globs anyway,
          # the exact bug this PR exists to close, just for hidden paths
          # instead of nested ones (round-1 review finding).
          shopt -s nullglob globstar dotglob
          "$RUNNER_TEMP/bin/shellcheck" --source-path=SCRIPTDIR -x tooling/**/*.sh hooks/**/*.sh collapsed/hooks/**/*.sh atlas_reviewer/**/*.sh
      - name: actionlint
        if: needs.changes.outputs.workflows == 'true'
        # timeout-minutes is a backstop, not the primary fix -- see the
        # shellcheck step's own comment above for the reasoning.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Same pinned-release-plus-checksum pattern as the shellcheck step
          # above, for the same reason: an apt/distro package would couple
          # this gate to whatever version the runner OS archive happens to
          # carry, which has already broken this repo's shellcheck pin twice
          # across OS moves.
          version=v1.7.12
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            x86_64|amd64)  arch=amd64; sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            *) echo "::error::unsupported architecture $(uname -m) for the pinned actionlint release"; exit 1 ;;
          esac
          curl --connect-timeout 10 --max-time 120 -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/${version}/actionlint_${version#v}_linux_${arch}.tar.gz"
          echo "${sha}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          chmod +x "$RUNNER_TEMP/bin/actionlint"
          "$RUNNER_TEMP/bin/actionlint" -version
          "$RUNNER_TEMP/bin/actionlint" -color

  tests:
    # tooling's suite plus the atlas_settings suite -- the two fast
    # coverage runs (52s and 15s hosted against ~8 minutes for the reviewer
    # suite), split into their own job so they stop queueing behind it.
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # persist-credentials: false -- this job never pushes anything (read-
      # only lint/test/audit), so there's no reason for the checked-out
      # working tree to retain the job's GITHUB_TOKEN in its git config for
      # the rest of the job. Narrows what a compromised dependency pulled in
      # by the pip install below could exfiltrate.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        with:
          python-version: "3.12"
          # Every run lands on a fresh hosted VM (D78) with a cold pip cache,
          # so `cache: 'pip'` buys a real speedup unconditionally. It is
          # arch-safe regardless: setup-python's `pip-cache.ts`
          # `computeKeys()` includes `process.arch` in both the primary and
          # restore keys (verified directly against the pinned SHA's source,
          # #475), so one architecture can never silently restore the other's
          # incompatible wheels.
          cache: 'pip'
      # #366's fresh-venv dance is retired (D78): it existed because the
      # persistent self-hosted runner's shared interpreter accumulated
      # site-packages across jobs, letting an already-installed pin report
      # "Requirement already satisfied" and skip its hash check entirely
      # (reproduced during that audit: ruff preinstalled, a forged hash of 64
      # zeros, exit 0). A per-run hosted VM removes the cross-job
      # accumulation -- but the interpreter this installs into is still the
      # image-baked setup-python tool-cache Python, whose contents GitHub
      # controls, so an image refresh could in principle ship a package
      # matching one of this repo's pins at the pinned version and reopen
      # the same skip. `--ignore-installed` closes that corner
      # unconditionally: pip resolves and downloads every pin regardless of
      # what the interpreter already holds, so every hash is verified on
      # every run. No venv and no $GITHUB_PATH export are needed --
      # setup-python already puts this exact interpreter's pip/python on
      # PATH for every later step (pip-tools, pip-audit, ruff, pytest,
      # tooling.cli included).
      - if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: pip install --require-hashes --ignore-installed -r requirements.txt
      - name: tests
        # Coverage settings (branch mode, the fail-under floor) live in
        # pyproject.toml's [tool.coverage] tables so a contributor running
        # `pytest --cov=tooling` locally gets the same gate CI enforces.
        #
        # The schedule special case that used to be spelled on this step
        # (a scheduled run must exercise the session-log currency check even
        # when the newest commit touches no filtered path) now lives in the
        # `changes` job's outputs -- see that job's comment.
        #
        # The two CI_* vars are read only by
        # tests/test_session_log_currency.py's pull_request gate (#548): a
        # PR whose own diff doesn't touch a `session_log_substantive`-filtered
        # path (a dependency bump -- Python *or* a `github-actions` pin --, a
        # shell-only change, ...) can't be the cause of calendar staleness, so
        # that one test skips the assertion instead of failing an unrelated
        # PR. A PR that DOES touch a substantive path still enforces even if
        # it also edits docs/session-log.md in the same diff -- touching the
        # file proves nothing about whether the edit added a *current* entry,
        # only the existing `last <= today`/`not stale` assertions can tell
        # (atlas + Copilot review round 1 on #550). Both vars are unset for
        # `push` and for a contributor's local `pytest` run -- there's no
        # single PR diff to reason about there, which is exactly the "many
        # small innocent merges left the log stale" case the calendar check
        # still needs to catch; on the weekly scheduled audit CI_EVENT_NAME
        # is `schedule`, which enforces unconditionally regardless of the
        # filter var (which the `changes` job forces true there anyway).
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_FILTER_SESSION_LOG_SUBSTANTIVE: ${{ needs.changes.outputs.session_log_substantive }}
        run: python -m pytest tests/ -q --cov=tooling
      - name: settings page tests (atlas_settings)
        # The BYOK settings page (config slice S10, part B1) is its own
        # top-level package with its own suite and its own coverage run
        # against the same [tool.coverage.report] floor, the way the
        # reviewer service's suite is. Fully offline: GitHub is a
        # scripted fake transport, the store is the real one over temp
        # files with an obviously fake Fernet key, and the egress
        # refusals run against numeric and loopback addresses that
        # resolve without any network.
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: python -m pytest atlas_settings/tests -q --cov=atlas_settings

  reviewer-tests:
    # The reviewer service's suite is the slow one (~4,600 tests, ~8 minutes
    # hosted with coverage), so it gets its own job instead of queueing the
    # fast suites behind it. A separate service boundary with its own suite
    # and its own coverage run against the same [tool.coverage.report] floor
    # (docs/plans/2026-11-06-manual-reviewer-service.md). Fully offline:
    # GitHub is a fixture directory, the Sprites runner is the in-memory
    # fake, the model provider is the offline one (OpenRouter, GitHub
    # App minting and Sprites are driven only through recorded fakes) --
    # no credentials and no network calls beyond a loopback HTTP server.
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # persist-credentials: false -- this job never pushes anything (read-
      # only lint/test/audit), so there's no reason for the checked-out
      # working tree to retain the job's GITHUB_TOKEN in its git config for
      # the rest of the job. Narrows what a compromised dependency pulled in
      # by the pip install below could exfiltrate.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        with:
          python-version: "3.12"
          # Every run lands on a fresh hosted VM (D78) with a cold pip cache,
          # so `cache: 'pip'` buys a real speedup unconditionally. It is
          # arch-safe regardless: setup-python's `pip-cache.ts`
          # `computeKeys()` includes `process.arch` in both the primary and
          # restore keys (verified directly against the pinned SHA's source,
          # #475), so one architecture can never silently restore the other's
          # incompatible wheels.
          cache: 'pip'
      # #366's fresh-venv dance is retired (D78): it existed because the
      # persistent self-hosted runner's shared interpreter accumulated
      # site-packages across jobs, letting an already-installed pin report
      # "Requirement already satisfied" and skip its hash check entirely
      # (reproduced during that audit: ruff preinstalled, a forged hash of 64
      # zeros, exit 0). A per-run hosted VM removes the cross-job
      # accumulation -- but the interpreter this installs into is still the
      # image-baked setup-python tool-cache Python, whose contents GitHub
      # controls, so an image refresh could in principle ship a package
      # matching one of this repo's pins at the pinned version and reopen
      # the same skip. `--ignore-installed` closes that corner
      # unconditionally: pip resolves and downloads every pin regardless of
      # what the interpreter already holds, so every hash is verified on
      # every run. No venv and no $GITHUB_PATH export are needed --
      # setup-python already puts this exact interpreter's pip/python on
      # PATH for every later step (pip-tools, pip-audit, ruff, pytest,
      # tooling.cli included).
      - if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: pip install --require-hashes --ignore-installed -r requirements.txt
      - name: reviewer service tests (atlas_reviewer)
        # `-n auto`: the suite's 4,600 tests spread over the runner's cores.
        # Measured locally on 4 workers: 6m19s serial -> ~1m45s with xdist
        # (~3.7x). pytest-cov merges coverage across the xdist workers into
        # one report, so the same [tool.coverage.report] floor is enforced
        # over the whole suite as before -- verified against live runs,
        # including order-shuffled ones. The suite is offline and its tests
        # share no mutable state (the per-context markers and facts are
        # reset per test), which is what makes worker parallelism safe
        # here; the shuffle runs are also what surfaced and pinned the
        # reset_events gap this PR fixes in call_facts.py.
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.requirements == 'true'
        run: python -m pytest atlas_reviewer/tests -q --cov=atlas_reviewer -n auto

  liveness-shards:
    # Computes the liveness matrix from the parity key itself, so a new
    # liveness-carrying key record is picked up automatically -- the
    # workflow never lists test ids or a hardcoded shard count. The
    # grouping (one shard per mutant, cheap quote/absent reads in the
    # first) and the selection contract live in
    # atlas_reviewer/liveness/sharding.py, whose import chain is
    # stdlib-only, so this job needs no dependency install.
    #
    # Runs unconditionally: it is seconds of Python, and the `liveness`
    # job below reads its outputs even on a run where that job skips.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compute the liveness shard list
        id: shards
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          from atlas_reviewer.liveness.sharding import shard_specs

          print(f"shards={json.dumps(shard_specs())}")
          PY

  liveness:
    # The parity key's liveness checks (D71's re-anchor update), fanned out
    # over the `liveness-shards` matrix: each liveness-carrying record is
    # verified against its own anchor commit -- a mutant splice must survive
    # the anchor's own full test suite, and a quote or absence must hold in
    # the anchor's files -- so a span that drifts from the anchor tree fails
    # the gate instead of grading a finding a reviewer cannot honestly
    # raise. The anchor suites cost minutes each and are why these checks
    # never ran inside the coverage steps; they were also what made the old
    # single `gate` job take ~23 minutes (three mutants plus two cached
    # baselines, five full suites serially), which is what this split
    # parallelizes: each shard runs its own mutant's suite plus that
    # anchor's baseline, instead of every suite queueing behind one job.
    # The round-5 anchor is not on any branch, so the step fetches it by
    # SHA from origin.
    needs: [changes, liveness-shards]
    # Path-gated on pull requests (the `liveness` filter in the `changes`
    # job): the check only exercises fixed anchor commits, so an ordinary
    # PR -- code, docs, skills -- cannot change its result and doesn't pay
    # ~8 minutes of anchor suites for nothing. It always runs on push to
    # main, on either schedule, and on workflow_dispatch: main and the
    # schedules are where environment drift gets caught (a pytest or
    # dependency release changing an anchor suite's pass set), since the
    # anchors themselves are fixed.
    #
    # The job-level `if:` is the only gate in this job -- every step needs
    # the environment whenever the job runs, so unlike the other jobs there
    # are no step-level `if:`s to keep in sync with it.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.liveness == 'true'
    runs-on: ubuntu-latest
    # 90 minutes bounded the old single job because five anchor suites ran
    # serially behind ~13 minutes of other steps, and two runs were killed
    # at exactly 15m20s back when the job was bounded at 15. A shard runs at
    # most its own mutant's suite plus that anchor's baseline -- two suite
    # passes, ~160s each on the hosted runner per the measurement that set
    # the old bound -- plus the ~2-minute install, so 30 bounds the job
    # with headroom for runner variance without letting a hung run eat
    # hours; the liveness test's own per-suite subprocess bound (20
    # minutes) still fails a hanging suite rather than the job clock.
    timeout-minutes: 30
    strategy:
      # One shard failing must not cancel the others: each shard's result
      # is independent evidence, and the aggregator below reads the
      # combined result either way.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.liveness-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # persist-credentials: false -- this job never pushes anything (read-
      # only lint/test/audit), so there's no reason for the checked-out
      # working tree to retain the job's GITHUB_TOKEN in its git config for
      # the rest of the job. Narrows what a compromised dependency pulled in
      # by the pip install below could exfiltrate.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          # Every run lands on a fresh hosted VM (D78) with a cold pip cache,
          # so `cache: 'pip'` buys a real speedup unconditionally. It is
          # arch-safe regardless: setup-python's `pip-cache.ts`
          # `computeKeys()` includes `process.arch` in both the primary and
          # restore keys (verified directly against the pinned SHA's source,
          # #475), so one architecture can never silently restore the other's
          # incompatible wheels.
          cache: 'pip'
      # #366's fresh-venv dance is retired (D78): it existed because the
      # persistent self-hosted runner's shared interpreter accumulated
      # site-packages across jobs, letting an already-installed pin report
      # "Requirement already satisfied" and skip its hash check entirely
      # (reproduced during that audit: ruff preinstalled, a forged hash of 64
      # zeros, exit 0). A per-run hosted VM removes the cross-job
      # accumulation -- but the interpreter this installs into is still the
      # image-baked setup-python tool-cache Python, whose contents GitHub
      # controls, so an image refresh could in principle ship a package
      # matching one of this repo's pins at the pinned version and reopen
      # the same skip. `--ignore-installed` closes that corner
      # unconditionally: pip resolves and downloads every pin regardless of
      # what the interpreter already holds, so every hash is verified on
      # every run. No venv and no $GITHUB_PATH export are needed --
      # setup-python already puts this exact interpreter's pip/python on
      # PATH for every later step (pip-tools, pip-audit, ruff, pytest,
      # tooling.cli included).
      - run: pip install --require-hashes --ignore-installed -r requirements.txt
      - name: parity-key liveness (anchor suites, sharded)
        # LIVENESS_SHARD=i/n (set by the matrix above) selects this job's
        # shard at collection time; the value is validated against the key
        # itself, so a matrix/key disagreement fails loudly rather than
        # silently skipping specs. Stays serial within the shard (no
        # pytest-xdist): a mutant spec splices a shared anchor worktree, so
        # parallel workers in one shard would race the splice.
        env:
          LIVENESS_SHARD: ${{ matrix.shard }}
        run: python -m pytest atlas_reviewer/liveness -q

  gate:
    # The final aggregator, still named `gate` so every consumer of that
    # check name (branch protection included) is unaffected by the split.
    # `if: always()` makes it report even when an upstream job failed; a
    # failed or cancelled needed job fails the gate, while a skipped one
    # counts as passing -- the skipped-means-passing semantics that
    # preserves #339's per-step gating at job granularity (a docs-only PR
    # skips the Python jobs and the gate still goes green).
    needs: [changes, lint, tests, reviewer-tests, liveness-shards, liveness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any needed job failed or was cancelled
        # `changes` and `liveness-shards` carry no `if:` of their own, so
        # anything but success there is already a real failure; the four
        # gated jobs may legitimately be skipped, and only a failure or a
        # cancellation fails the gate.
        if: >-
          needs.changes.result != 'success' ||
          needs.lint.result == 'failure' || needs.lint.result == 'cancelled' ||
          needs.tests.result == 'failure' || needs.tests.result == 'cancelled' ||
          needs.reviewer-tests.result == 'failure' || needs.reviewer-tests.result == 'cancelled' ||
          needs.liveness-shards.result != 'success' ||
          needs.liveness.result == 'failure' || needs.liveness.result == 'cancelled'
        run: |
          echo "::error::gate failed: changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} tests=${{ needs.tests.result }} reviewer-tests=${{ needs.reviewer-tests.result }} liveness-shards=${{ needs.liveness-shards.result }} liveness=${{ needs.liveness.result }}"
          exit 1
      - name: Report the gate green
        run: echo "gate green -- every needed job passed or was (deliberately) skipped"
