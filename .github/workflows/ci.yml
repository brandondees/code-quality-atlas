name: ci

# No `paths:` filter here (#339): a path-filtered `on:` trigger means the
# workflow never RUNS at all for a push/PR that touches none of the listed
# paths, which leaves any branch-protection-required check on this workflow
# stuck permanently pending instead of reporting a conclusion. Gate individual
# steps below instead (via one dorny/paths-filter step + per-step `if:`), so
# the workflow always reports a real conclusion -- success or a fast
# `skipped` step (which branch protection treats as passing) -- never
# silence. This job's steps have genuinely disjoint input sets (Python code
# vs. requirements.in/.txt vs. shell scripts vs. Markdown), so per-step
# gating is used rather than an all-or-nothing job-level gate (the
# calendar-proxy `changes`-job pattern used elsewhere in this org): a single
# job-level gate can't let e.g. markdownlint run on a docs-only change while
# skipping the Python pipeline, without also either pulling every Markdown
# change into the expensive path or dropping Markdown lint coverage
# entirely -- see #339 for the fuller reasoning.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, path-independent: the "dependency vulnerability audit" step below
  # is path-gated (only runs when python/requirements changed), so a CVE
  # published against an unchanged pin is never scanned between pushes (#379).
  # This trigger and the step's own `if:` (search "schedule" below) exist so
  # pip-audit runs against main on a fixed cadence regardless of diff.
  schedule:
    - cron: "0 6 * * 1"

# Self-hosted runners don't get a fresh VM per run and this repo's own
# runner registration processes one job at a time (docs/self-hosted-
# runners.md), so without a concurrency group, superseded pushes to a
# branch don't cancel -- they queue behind each other. Observed on this
# fleet: three obsolete runs of the same workflow stacked on one branch,
# each holding the single runner in turn ahead of everything else (#378).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let a push to main (or a scheduled run)
  # always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    # #471: this job used to be self-hosted unconditionally, gated by an
    # in-tree `if:` that skipped `pull_request` runs from a fork (persistent,
    # personally-owned hardware executing arbitrary fork code was judged
    # unacceptable).
    #
    # IMPORTANT, corrected after round-1 review (CodeRabbit) questioned the
    # original version of this comment: for plain `pull_request` (unlike
    # `pull_request_target`), GitHub evaluates the workflow file as it exists
    # in the PR's own head -- confirmed against GitHub's own "Approving
    # workflow runs from forks" guidance, which explicitly tells an approver
    # to scrutinize proposed `.github/workflows/` changes (guidance that would
    # be meaningless if such changes never took effect). That means a hostile
    # PR editing THIS `runs-on:` expression back to an unconditional
    # `[self-hosted, Linux]` gets that edit evaluated for its own run, exactly
    # as it could have edited the old `if:` gate -- an editable in-tree
    # condition can never structurally stop the PR that is editing it. The
    # change below is therefore **not** a structural fix and does not, by
    # itself, close #471; it narrows the default exposure window (a
    # non-tampering `pull_request` run -- the overwhelming common case --
    # now safely lands on ephemeral hosted hardware, same-repo or fork,
    # instead of this fleet's persistent self-hosted hardware) while leaving
    # the tampering case exactly where #471 originally placed it: gated only
    # by the GitHub Settings value ("Require approval for all outside
    # collaborators", not the default "first-time contributors only") that
    # this repo's Settings must actually carry -- unverifiable from a
    # checkout, and not changed by this commit. Real protection against a
    # PR that edits its own `runs-on:`/`if:` needs a mechanism GitHub
    # enforces independently of this file's content (that Settings value, or
    # a required-reviewers Environment) -- tracked separately, not solved
    # here.
    #
    # `push`/`schedule` (which never carry arbitrary fork content -- `push`
    # here is branch-limited to `main` above, and `schedule` has no PR at
    # all) stay on self-hosted, since neither can be forged by an untrusted
    # PR branch. A side effect worth keeping regardless of the above: a
    # non-tampering fork PR now gets a real CI run instead of an
    # unconditional `skipped` step, the trade-off the old fork-gate's own
    # comment had already flagged as worth revisiting once external
    # contributions became common.
    #
    # Arch-agnostic on the self-hosted side on purpose: the fleet has an
    # x86_64 Linux host (bazzite-runner-*) registered alongside the Mac's
    # arm64 OrbStack VM, and `push`/`schedule` runs can land on either.
    # Pinning ARM64 would strand this job on one machine and leave it queued
    # whenever that machine is down or busy. `pull_request` runs always land
    # on `ubuntu-latest` (x86_64) now, which moves arm64 coverage from
    # pre-merge to post-merge only (round-1 review, `dees-bot`): before this
    # change, a same-repo `pull_request` run could land on either self-hosted
    # host, including arm64, giving a PR a chance at arm64 signal before
    # merge; now an arm64-specific regression surfaces only once it's already
    # on `main` via the `push` trigger. Low practical risk given the next
    # paragraph (nothing here is genuinely arch-specific), but real: arm64 is
    # still exercised, just later.
    #
    # Nothing in this job is arch-specific either way: the only step that
    # fetches a prebuilt binary is `shellcheck` below, which already selects
    # its asset and checksum from `uname -m` and errors loudly on an
    # unrecognized arch rather than downloading the wrong one. Everything
    # else is Python, actions/setup-python (which publishes both arches), or
    # pure-Node actions.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
    timeout-minutes: 15
    # pull-requests:read is required by dorny/paths-filter (below) to list a
    # PR's changed files via the GitHub API; push events don't hit that path,
    # but the permission must be granted unconditionally at the job level
    # since job-level `permissions:` replaces rather than merges with the
    # workflow-level default above.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # persist-credentials: false -- this job never pushes anything (read-
      # only lint/test/audit), so there's no reason for the checked-out
      # working tree to retain the job's GITHUB_TOKEN in its git config for
      # the rest of the job. Narrows what a compromised dependency pulled in
      # by the steps below (pip installs, markdownlint-cli2-action) could
      # exfiltrate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Four independent outputs, matched to this job's genuinely disjoint
      # step input sets (see the `on:` comment above for why this is
      # per-step rather than one job-level gate). `python`/`requirements`
      # jointly gate the whole pip-install-through-generated-tree-check
      # sequence below (cheap enough, and interdependent enough via the
      # shared Python env, that splitting them further isn't worth the
      # complexity); `shell` and `markdown` each gate their own single step
      # independently, since shellcheck and markdownlint need no Python
      # setup at all.
      #
      # `docs/research/**` is in `python`, not treated as docs-only: every
      # entry in skills/manifest.yaml's `source:` field is a
      # `docs/research/*.md` path that `tooling.cli generate`/`drift`
      # actually reads at generation time (tooling/generate_common.py,
      # tooling/drift.py) -- a change there can change generated output and
      # must reach the generated-tree-check.
      #
      # Round 3 review found this list was STILL incomplete after two prior
      # fix rounds each patched a narrower subset (round 1: only checked
      # `tooling/*.py`; round 2: checked `tests/*.py` but only for the paths
      # that round's reviewer happened to name). Rather than a fourth manual
      # patch of the same shape, this round did an exhaustive audit of every
      # path any `tests/*.py` file reads and added
      # `tests/test_ci_python_filter_covers_known_reads.py`, which asserts
      # this filter covers every path in that audit's inventory -- so the
      # NEXT gap (a new test reading a new path) is a failing test here
      # instead of a fifth review round. The full audit, for reference:
      # `commands/atlas-init.md`/`templates/agents-routing-snippet.md`/
      # `AGENTS.md`/`CLAUDE.md` (test_routing_snippet_sync.py, issues
      # #64/#167's drift guard); `templates/REVIEW.md`/`REVIEW.md`
      # (test_review_template_sync.py); `docs/map/**`
      # (test_map_twins_sync.py); `LICENSE*` (test_license_paths_exhaustive.py,
      # walking top-level dirs; also covers `LICENSE-CC-BY-4.0`, read by
      # test_vendor_skills.py/test_package_account_zips.py); `.pre-commit-config.yaml`
      # (test_precommit_ci_version_sync.py); `hooks/**`
      # (test_hooks.py -- NOT covered by being in the `shell` filter below,
      # since `shell` doesn't gate the `tests` step); `.claude-plugin/
      # plugin.json`/`marketplace.json`/`README.md`/`docs/distribution.md`/
      # `docs/install.md`/`docs/collapsed-entrypoints-and-depth-modes.md`/
      # `docs/review-depth-modes.md`/`docs/open-questions.md`
      # (test_doc_counts.py); `.claude/skills/**`
      # (test_self_vendored_skills_sync.py, test_map_twins_sync.py). The
      # rest of `docs/` (session-log.md, runbooks/, plans/) remains
      # genuinely markdown-only -- no test or tooling module reads those
      # paths, and the drift-guard test above would catch it if that ever
      # changed.
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - "skills/**"
              - "collapsed/**"
              - "tooling/**"
              - "tests/**"
              - "docs/research/**"
              - "commands/**"
              - "templates/**"
              - "docs/map/**"
              - "hooks/**"
              - ".claude/skills/**"
              - "AGENTS.md"
              - "CLAUDE.md"
              - "README.md"
              - "REVIEW.md"
              - "LICENSE*"
              - ".claude-plugin/plugin.json"
              - ".claude-plugin/marketplace.json"
              - "docs/distribution.md"
              - "docs/install.md"
              - "docs/collapsed-entrypoints-and-depth-modes.md"
              - "docs/review-depth-modes.md"
              - "docs/open-questions.md"
              - "*.py"
              - "pyproject.toml"
              - ".python-version"
              - ".pre-commit-config.yaml"
              - ".github/workflows/ci.yml"
            requirements:
              - "requirements.in"
              - "requirements.txt"
            shell:
              - "tooling/**/*.sh"
              - "hooks/**"
              - "collapsed/hooks/**"
              # The whole workflows/ tree, not just ci.yml: actionlint below
              # also shells out to shellcheck for embedded run: scripts in
              # *any* workflow file, so a change to a workflow other than
              # ci.yml must install shellcheck too, not just gate actionlint
              # itself via `workflows:` below (#379).
              - ".github/workflows/**"
            markdown:
              - "**/*.md"
              - ".markdownlint-cli2.jsonc"
              - ".markdownlint-cli2.yaml"
              - ".markdownlint-cli2.cjs"
              - ".markdownlint-cli2.mjs"
              - ".markdownlint.cjs"
              - ".markdownlint.mjs"
              - ".github/workflows/ci.yml"
            # `.github/workflows/ci.yml` above only ever matches itself, so a
            # change anywhere else under `.github/` (a new workflow file, a
            # `dependabot.yml` edit, ...) previously executed zero checks
            # here (#379). This filter covers the whole tree and gates the
            # actionlint step below.
            workflows:
              - ".github/**"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.event_name == 'schedule' || steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        with:
          python-version: "3.12"
      # #475: no `cache: 'pip'` above. #475 originally suspected this pinned
      # action's pip cache key was arch-blind (`runner.os` only, per
      # docs/self-hosted-runners.md's general "Known gotchas" warning for
      # actions/cache) and would let one of this job's two self-hosted
      # architectures (x86_64/arm64, see the job's own comment above)
      # silently restore the other's incompatible wheels. That premise
      # doesn't hold for this pinned commit: setup-python@v7.0.0's
      # `pip-cache.ts` `computeKeys()` already includes `process.arch` in
      # both the primary and restore keys (verified directly against the
      # pinned SHA's source), so it's already arch-safe -- no different
      # from `Swatinem/rust-cache` keying on the rustc host triple, per
      # that same doc section. `cache: 'pip'` is still dropped, but for an
      # unrelated, independently-valid reason: these are persistent
      # self-hosted runners (not ephemeral hosted ones), so each host's own
      # local `~/.cache/pip` already survives between jobs without
      # actions/cache's network round-trip to GitHub's cache API, and the
      # fresh-venv `--require-hashes` install below is already the source
      # of correctness, not the cache -- so actions/cache here would add
      # network overhead for a warm cache that's already local, not close
      # an arch-mixing gap.
      # #366: this runner is self-hosted and persistent (see the job's own
      # comment above) -- installing straight into its interpreter meant any
      # pin already present in site-packages from a prior job was reported
      # "Requirement already satisfied" and its hash was never checked at
      # all, silently defeating --require-hashes below. Reproduced during the
      # audit: with ruff already installed, a requirements.txt pinning it
      # with a hash of 64 zeros still exited 0. A fresh venv per job (--clear
      # as defense in depth, in case a self-hosted runner's $RUNNER_TEMP ever
      # isn't wiped between jobs the way a hosted runner's is) guarantees
      # nothing is ever already-satisfied, so every pin's hash is verified on
      # every run. Exporting its bin/ onto $GITHUB_PATH -- rather than only
      # this step -- carries the same guarantee through every later step that
      # invokes pip/python/ruff/pytest (pip-tools and pip-audit below
      # included), without touching each of them individually.
      - if: github.event_name == 'schedule' || steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          python -m venv --clear "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: lint (ruff)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: ruff check .
      - name: format (ruff)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: ruff format --check .
      - name: tests
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        # Coverage settings (branch mode, the fail-under floor) live in
        # pyproject.toml's [tool.coverage] tables so a contributor running
        # `pytest --cov=tooling` locally gets the same gate CI enforces.
        run: python -m pytest tests/ -q --cov=tooling
      - name: eval structure (all skills)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m tooling.cli eval
      - name: eval structure (collapsed entrypoints)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m tooling.cli eval --skills-root collapsed/skills
      - name: provenance drift
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m tooling.cli drift
      - name: Generated trees are in sync
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          python -m tooling.cli generate --manifest skills/manifest.yaml --docs-root . --skills-root skills --collapsed-root collapsed
          ok=1
          # `git diff --exit-code` only sees paths git already tracks — a generator
          # emitting a brand-new file (or leaving one orphaned untracked after a
          # rename) shows up as untracked, not modified, and the plain diff below
          # would report clean. `git add -A -- <path>` stages creations/deletions
          # too, so `git diff --cached` actually sees them (#382).
          git add -A -- skills/ collapsed/
          git diff --cached --exit-code -- skills/    || { git diff --cached --stat -- skills/;    echo "::error::standalone skills/ drifted — regenerate and commit"; ok=0; }
          git diff --cached --exit-code -- collapsed/ || { git diff --cached --stat -- collapsed/; echo "::error::collapsed/ drifted — regenerate and commit"; ok=0; }
          git diff --exit-code -- README.md docs/distribution.md docs/install.md docs/collapsed-entrypoints-and-depth-modes.md docs/review-depth-modes.md .claude-plugin/plugin.json .claude-plugin/marketplace.json || { git diff --stat -- README.md docs/distribution.md docs/install.md docs/collapsed-entrypoints-and-depth-modes.md docs/review-depth-modes.md .claude-plugin/plugin.json .claude-plugin/marketplace.json; echo "::error::documented counts drifted — regenerate and commit"; ok=0; }
          [ "$ok" -eq 1 ]
      - name: license compatibility
        # #472: pip-audit (below) gates CVEs, but nothing previously checked
        # dependency *licenses* against this repo's own MIT + CC BY posture
        # (D11) -- a future requirements.in addition with an incompatible
        # license would merge unnoticed. Allow-list, not a copyleft deny-
        # list: --allow-only fails on anything not explicitly known-
        # compatible, so a license this list has never seen is treated as
        # unproven rather than assumed fine.
        #
        # Exact match, deliberately NOT --partial-match: a first version of
        # this step used --partial-match for convenience (so "MIT" matches
        # "MIT License" etc.), but pip-licenses implements that as a plain
        # case-insensitive substring test of each allow-list entry against
        # the package's *whole* reported license string
        # (case_insensitive_partial_match_set_diff in piplicenses.py) --
        # confirmed directly against the pinned version's source. For a
        # package reporting a single joined multi-license expression (this
        # repo already has one real instance: `packaging` reports
        # "Apache-2.0 OR BSD-2-Clause" as one string, not two), that means a
        # combined "GPL-3.0-only AND BSD-3-Clause" would also match on the
        # "BSD-3-Clause" substring and pass silently -- BSD alone being
        # allowed says nothing about whether the AND'd GPL term is, so
        # substring matching can't tell an "OR" (either term is fine) apart
        # from an "AND" (every term must be) (round-1 review finding,
        # CodeRabbit). Exact match closes this: a package's full reported
        # license string must appear in the allow-list verbatim, so a new
        # combined expression -- AND or OR -- has to be explicitly reviewed
        # and added, not silently pass because one of its terms happens to
        # already be listed. The list below already carries the one
        # legitimate combined string this repo's tree currently produces
        # ("Apache-2.0 OR BSD-2-Clause", both of whose terms are actually
        # allowed) verbatim for exactly this reason.
        #
        # Placement matters: this step must run here, before
        # requirements.txt-is-in-sync/dependency-vulnerability-audit install
        # pip-tools/pip-audit into this same venv, for the identical reason
        # those two steps' own comment below states -- pip-licenses scans
        # every package installed in the interpreter, not just
        # requirements.txt's own tree, so running it after those unpinned
        # CI-only tools land would gate their transitive deps too (caught in
        # CI: pip-audit's own `rich` dependency pulled in typing_extensions,
        # whose license string didn't match this list, on a tool this repo
        # never ships or imports). The list below is exactly the set
        # `pip-licenses` reports for requirements.txt's own dependency tree
        # at this point in the job, verified both locally and against a live
        # CI run before landing here -- extend it deliberately when a new
        # requirements.in addition needs a license already known to be
        # compatible but not yet listed, same revisit-trigger shape as the
        # pip-tools/pip-audit/pip-licenses pins (see D21 in
        # docs/open-questions.md for why all three stay unhashed).
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          pip install pip-licenses==5.5.5
          pip-licenses --allow-only="MIT License;MIT;BSD License;BSD-2-Clause;BSD-3-Clause;Apache Software License;Apache-2.0;Apache 2.0;Apache-2.0 OR BSD-2-Clause;Python Software Foundation License;PSF-2.0;ISC License (ISCL);The Unlicense (Unlicense)"
      # requirements.txt-is-in-sync and dependency-vulnerability-audit run
      # last among the python-filtered steps, deliberately (#378): both
      # `pip install` an unpinned tool (pip-tools/pip-audit) straight into
      # this job's fresh venv, on top of the hash-verified `requirements.txt`
      # install above. Every trusted gate above them (lint, format, tests,
      # eval structure, drift, generated-tree sync, license compatibility)
      # has already run and passed against the hash-verified install alone
      # by the time either of these unpinned tools lands in the same
      # interpreter.
      - name: requirements.txt is in sync with requirements.in
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          # pip-tools 7.6.0 crashed under pip 26.2 (RequirementCommand's
          # make_requirement_preparer gained a required `allow_editables`
          # kwarg pip-tools 7.6.0 didn't pass) — pip-tools 7.6.1 (2026-08-11)
          # fixed that compatibility, so no pip-version workaround is needed
          # any more; pip-tools alone is pinned exact so this step's own gate
          # stays reproducible. Not hash-verified like requirements.txt's
          # deps — considered and deliberately skipped: it's CI-only tooling,
          # not shipped or imported by this repo's own code, and a
          # hash-pinned requirements-dev.txt for one tool was judged not
          # worth the added Dependabot/maintenance surface.
          pip install pip-tools==7.6.1
          # The committed lockfile is seeded into the check dir, not just the .in.
          # Without it pip-compile resolves from scratch and pins whatever is
          # newest on PyPI *today*, so any upstream release turns every open PR
          # red for a reason unrelated to its diff — that happened on three
          # consecutive PRs (#204/#206/#208, all of them a fresh `ruff`). With the
          # lockfile present, pip-compile keeps existing pins that still satisfy
          # requirements.in, so this step asserts what it is named for
          # (lockfile *consistent with* the .in, hashes genuine, no hand-edits)
          # rather than "the lockfile is the newest possible resolution".
          #
          # What this step does NOT check, stated because a first draft of this
          # comment claimed otherwise: with the lockfile seeded, pip-compile
          # reuses an already-satisfying pinned line *verbatim, hash included*,
          # and only computes hashes for packages it newly resolves. So a
          # hand-edited hash on an already-pinned package survives this diff.
          # `pip install --require-hashes` above (into a fresh per-job venv,
          # #366) catches most of that: it verifies the one artifact pip
          # actually resolves and downloads for this job's platform/Python
          # against the hash(es) listed for it, and exits 1 on any mismatch.
          #
          # #366: what it does NOT do, despite a second draft of this comment
          # claiming otherwise -- is verify every hash in the committed
          # lockfile. A requirement line can list hashes for several
          # platforms' wheels (sdist, manylinux, macOS, Windows, ...), and pip
          # only ever downloads and checks the one it selects for the running
          # job. A forged hash on a wheel this platform never selects passes
          # both this step's diff and that install silently (reproduced with
          # a forged pyyaml hash during the audit). Hash integrity for the
          # platform this job actually runs on is that step's; .in consistency
          # is this one's; cross-platform hash coverage is neither's.
          #
          # Freshness is neither step's, and is already owned twice: Dependabot
          # proposes upgrades weekly as their own PRs, and `pip-audit` below
          # fails on a pin with a known CVE — the question that actually matters
          # about a stale pin. Verified against pip-tools 7.6.0 that this check
          # still fails on a raised .in floor and on a dependency dropped from
          # the .in.
          #
          # 2026-08-26: this step went red on every open PR with zero .in/.txt
          # diff in any of them — pip-compile started emitting `--no-index` in
          # its own regenerated header comment (Python 3.12, pip-tools 7.6.1)
          # where it previously didn't. requirements.in itself is NOT fully
          # pinned (>= floors, e.g. `ruff>=0.16.4`). #378's audit found the
          # comment that used to sit here (blaming a "warm local wheel cache")
          # was wrong: reading piptools.utils.get_compile_command (7.6.1)
          # shows the regenerated header re-includes any option whose
          # *resolved* value differs from that click Option's own hardcoded
          # default -- regardless of whether the CLI, a discovered pip-tools
          # config file, or a `PIP_*`-style environment variable is what
          # actually set it, and regardless of wheel-cache state. A
          # machine-local default for `--no-index` (or any other flag) making
          # the header differ between two otherwise-identical runs is exactly
          # that: an environment difference on the header line, not a
          # resolution difference in the pins below it. Reproduced cold (fresh
          # venv, cleared pip cache) that the header's presence/absence tracks
          # the machine's own pip-tools-visible defaults, not cache warmth.
          #
          # Since the header can legitimately vary by machine for reasons that
          # have nothing to do with requirements.in/.txt actually drifting,
          # this step now diffs only the non-comment lines (#378) -- the
          # pinned packages and hashes, which is what this step exists to
          # verify -- rather than the whole file. The comment lines
          # documenting how the file was produced are informational, not part
          # of the contract this gate checks.
          # $RUNNER_TEMP unconditionally, no ${RUNNER_TEMP:-/tmp} fallback --
          # matching the convention the require-hashes install and shellcheck
          # steps in this same job already use (#366/#378): GitHub Actions
          # guarantees the var is set on every runner, so a fallback here
          # would only mask it silently going missing rather than failing loudly.
          work="$(mktemp -d "$RUNNER_TEMP/reqcheck.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cp requirements.in requirements.txt "$work"/
          ( cd "$work" && pip-compile --generate-hashes --output-file=requirements.txt requirements.in )
          diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' "$work/requirements.txt") || {
            echo "::error::requirements.txt is not consistent with requirements.in (or was hand-edited) — recompile with pip-compile --generate-hashes and commit"
            exit 1
          }
      - name: dependency vulnerability audit
        # Also runs on the weekly `schedule` trigger above (#379), independent
        # of the path filter, so a CVE against an unchanged pin doesn't wait
        # for the next python/requirements-touching push to be caught.
        if: github.event_name == 'schedule' || steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          # pip-audit IS the CI vulnerability gate this repo relies on — unlike
          # requirements.txt's deps (hash-pinned, resolved once and committed),
          # an unpinned `pip install pip-audit` re-resolves to whatever is
          # newest on PyPI on every run, so the gate itself isn't reproducible:
          # a scanner-tool release could change what CVEs are flagged (or
          # silently drop advisory coverage) with no diff in this repo to
          # review. Pinned exact-version like pip-tools above, though for a
          # different reason: that pin is about the requirements-check step's
          # own reproducibility (a pip-tools release could change what it
          # resolves), this one is about the vulnerability-audit gate's.
          # Like that pin, Dependabot has no manifest that
          # covers a version pinned inline in a `run:` script (its `pip`
          # ecosystem entry tracks requirements.txt/.in; `github-actions`
          # tracks `uses:` refs) — this pin has no automated freshness path.
          # Revisit trigger: bump manually whenever a new pip-audit release
          # ships, at minimum whenever `mise run audit`/this step starts
          # missing a CVE you'd expect it to catch; consider moving this to a
          # Dependabot-tracked requirements-dev.txt if it drifts noticeably.
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt
      - name: markdownlint
        if: steps.filter.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      - name: shellcheck
        # workflows is included, not just shell: actionlint (below) is gated
        # on the broader `workflows` filter (.github/**) and shells out to
        # shellcheck for embedded run: scripts in any workflow file -- a
        # change confined to a non-workflow file under .github/ (e.g.
        # .github/dependabot.yml) would set workflows=true/shell=false and
        # run actionlint with shellcheck nowhere on PATH, silently skipping
        # its embedded-script checks (dees-bot round-2 review on #379).
        if: steps.filter.outputs.shell == 'true' || steps.filter.outputs.workflows == 'true'
        # timeout-minutes is a backstop, not the primary fix: normal runtime here
        # is a few seconds, so 3 minutes only bounds a hang, never a real run.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Installed from the upstream release rather than apt, deliberately.
          #
          # The previous `apt-get install shellcheck=<exact>` pin coupled this
          # gate to whichever shellcheck version the *runner OS archive*
          # happened to carry, and that broke twice in quick succession as the
          # runner moved: 0.9.0-1 exists on ubuntu-24.04 but not on 25.10, and
          # 0.10.0-1 exists on 25.10 but not on 26.04 (which ships 0.11.0-2).
          # Each move failed the job outright with "Version '<x>' was not
          # found" — a CI break caused purely by infrastructure, with no diff
          # in this repo. Re-pinning to each new OS's version would also
          # silently change *which* shellcheck gates this repo every time the
          # host is rebuilt, which is exactly what an exact pin exists to
          # prevent.
          #
          # The upstream tarball decouples the two: the version is pinned by
          # this file (reproducible, and only ever changed deliberately), and
          # it installs identically on any Linux host regardless of distro or
          # release. Checksums are per-arch and verified, matching the
          # pinned-release-plus-checksum pattern used elsewhere in this org's
          # CI. Both arches are listed so this step stays correct if the job
          # ever moves back to a hosted x86_64 runner.
          #
          # Version is unchanged from the previous pin (0.10.0) — verified
          # again on the current runner that it reports no findings across
          # this repo's scripts, so this is a change of *install mechanism*,
          # not of what the gate enforces.
          version=v0.10.0
          case "$(uname -m)" in
            aarch64|arm64) arch=aarch64; sha=324a7e89de8fa2aed0d0c28f3dab59cf84c6d74264022c00c22af665ed1a09bb ;;
            x86_64|amd64)  arch=x86_64;  sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 ;;
            *) echo "::error::unsupported architecture $(uname -m) for the pinned shellcheck release"; exit 1 ;;
          esac
          curl --connect-timeout 10 --max-time 120 -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.${arch}.tar.xz"
          echo "${sha}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          # $RUNNER_TEMP, not $HOME/.local/bin (#378): this host is shared
          # across repos with nothing reset between jobs, and $HOME/.local/bin
          # persisted the binary onto every later job's PATH indefinitely.
          # $RUNNER_TEMP is documented to be wiped between jobs, though (per
          # the same hedge the require-hashes install above makes, #366) this
          # step doesn't actually depend on that: it downloads, checksums,
          # and overwrites the pinned binary unconditionally every run, so a
          # leftover from a prior job here would just be clobbered, never
          # trusted-as-is.
          mkdir -p "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/shellcheck-${version}/shellcheck" "$RUNNER_TEMP/bin/shellcheck"
          chmod +x "$RUNNER_TEMP/bin/shellcheck"
          "$RUNNER_TEMP/bin/shellcheck" --version
          # actionlint (below) shells out to `shellcheck` via a bare PATH
          # lookup for embedded run: scripts -- without this, it silently
          # skips that check rather than failing, so the gap wouldn't even
          # show up as red CI (#379).
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # globstar makes `**` recurse into subdirectories, matching what
          # the `shell:` paths-filter above actually promises to cover
          # (`tooling/**/*.sh`, `hooks/**`, `collapsed/hooks/**`) -- the
          # previous one-level-deep globs (tooling/*.sh, hooks/lib/*.sh, ...)
          # silently stopped scanning a script the filter still correctly
          # detected as changed. tests/test_ci_shellcheck_glob_covers_tree.py
          # guards this by asserting these globs match every *.sh file
          # actually present under the three trees.
          #
          # dotglob too: dorny/paths-filter@v4.0.3 sets picomatch's `dot:
          # true` internally (verified against its source), so the `shell:`
          # filter above already matches a dot-prefixed path -- without
          # dotglob, a hidden .sh file would correctly trigger this step via
          # the filter and then be silently skipped by these globs anyway,
          # the exact bug this PR exists to close, just for hidden paths
          # instead of nested ones (round-1 review finding).
          shopt -s nullglob globstar dotglob
          "$RUNNER_TEMP/bin/shellcheck" --source-path=SCRIPTDIR -x tooling/**/*.sh hooks/**/*.sh collapsed/hooks/**/*.sh
      - name: actionlint
        if: steps.filter.outputs.workflows == 'true'
        # timeout-minutes is a backstop, not the primary fix -- see the
        # shellcheck step's own comment above for the reasoning.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Same pinned-release-plus-checksum pattern as the shellcheck step
          # above, for the same reason: an apt/distro package would couple
          # this gate to whatever version the runner OS archive happens to
          # carry, which has already broken this repo's shellcheck pin twice
          # across OS moves on this fleet.
          version=v1.7.12
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            x86_64|amd64)  arch=amd64; sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            *) echo "::error::unsupported architecture $(uname -m) for the pinned actionlint release"; exit 1 ;;
          esac
          curl --connect-timeout 10 --max-time 120 -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/${version}/actionlint_${version#v}_linux_${arch}.tar.gz"
          echo "${sha}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          chmod +x "$RUNNER_TEMP/bin/actionlint"
          "$RUNNER_TEMP/bin/actionlint" -version
          "$RUNNER_TEMP/bin/actionlint" -color
