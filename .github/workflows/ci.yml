name: ci

# No `paths:` filter here (#339): a path-filtered `on:` trigger means the
# workflow never RUNS at all for a push/PR that touches none of the listed
# paths, which leaves any branch-protection-required check on this workflow
# stuck permanently pending instead of reporting a conclusion. Gate individual
# steps below instead (via one dorny/paths-filter step + per-step `if:`), so
# the workflow always reports a real conclusion -- success or a fast
# `skipped` step (which branch protection treats as passing) -- never
# silence. This job's steps have genuinely disjoint input sets (Python code
# vs. requirements.in/.txt vs. shell scripts vs. Markdown), so per-step
# gating is used rather than an all-or-nothing job-level gate (the
# calendar-proxy `changes`-job pattern used elsewhere in this org): a single
# job-level gate can't let e.g. markdownlint run on a docs-only change while
# skipping the Python pipeline, without also either pulling every Markdown
# change into the expensive path or dropping Markdown lint coverage
# entirely -- see #339 for the fuller reasoning.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # Fork-PR gate. This is the load-bearing one in this repo: unlike the
    # other repos on this runner, code-quality-atlas is PUBLIC, so `on:
    # pull_request` genuinely can carry code from an arbitrary contributor.
    # A self-hosted runner executes the checked-out tree directly on
    # personally-owned hardware rather than an ephemeral VM, so a fork PR
    # must report "skipped" (which branch protection treats as passing)
    # instead of running here. Same-repo branch PRs are unaffected.
    #
    # NOTE: this means fork PRs get no CI signal at all rather than a
    # GitHub-hosted one -- an accepted trade, since the alternative is
    # executing untrusted code on a personal machine. If external
    # contributions become common, split this into a hosted job for
    # `pull_request` and a self-hosted job for `push`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Arch-agnostic on purpose: the fleet now has an x86_64 Linux host
    # (bazzite-runner-*) registered alongside the Mac's arm64 OrbStack VM, and
    # this job can run on either. Pinning ARM64 would strand it on one machine
    # and leave it queued whenever that machine is down or busy.
    #
    # Nothing in this job is arch-specific: the only step that fetches a
    # prebuilt binary is `shellcheck` below, which already selects its asset
    # and checksum from `uname -m` and errors loudly on an unrecognized arch
    # rather than downloading the wrong one. Everything else is Python,
    # actions/setup-python (which publishes both arches), or pure-Node actions.
    #
    # Keep the fork gate above in front of this. It matters more, not less,
    # with a second host: this repo is public, so `on: pull_request` can carry
    # arbitrary contributors' code, and a self-hosted runner executes the
    # checked-out tree directly on personally-owned hardware.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    # pull-requests:read is required by dorny/paths-filter (below) to list a
    # PR's changed files via the GitHub API; push events don't hit that path,
    # but the permission must be granted unconditionally at the job level
    # since job-level `permissions:` replaces rather than merges with the
    # workflow-level default above.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # persist-credentials: false -- this job never pushes anything (read-
      # only lint/test/audit), so there's no reason for the checked-out
      # working tree to retain the job's GITHUB_TOKEN in its git config for
      # the rest of the job. Narrows what a compromised dependency pulled in
      # by the steps below (pip installs, markdownlint-cli2-action) could
      # exfiltrate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Four independent outputs, matched to this job's genuinely disjoint
      # step input sets (see the `on:` comment above for why this is
      # per-step rather than one job-level gate). `python`/`requirements`
      # jointly gate the whole pip-install-through-generated-tree-check
      # sequence below (cheap enough, and interdependent enough via the
      # shared Python env, that splitting them further isn't worth the
      # complexity); `shell` and `markdown` each gate their own single step
      # independently, since shellcheck and markdownlint need no Python
      # setup at all.
      #
      # `docs/research/**` is in `python`, not treated as docs-only: every
      # entry in skills/manifest.yaml's `source:` field is a
      # `docs/research/*.md` path that `tooling.cli generate`/`drift`
      # actually reads at generation time (tooling/generate_common.py,
      # tooling/drift.py) -- a change there can change generated output and
      # must reach the generated-tree-check.
      #
      # Round 3 review found this list was STILL incomplete after two prior
      # fix rounds each patched a narrower subset (round 1: only checked
      # `tooling/*.py`; round 2: checked `tests/*.py` but only for the paths
      # that round's reviewer happened to name). Rather than a fourth manual
      # patch of the same shape, this round did an exhaustive audit of every
      # path any `tests/*.py` file reads and added
      # `tests/test_ci_python_filter_covers_known_reads.py`, which asserts
      # this filter covers every path in that audit's inventory -- so the
      # NEXT gap (a new test reading a new path) is a failing test here
      # instead of a fifth review round. The full audit, for reference:
      # `commands/atlas-init.md`/`templates/agents-routing-snippet.md`/
      # `AGENTS.md`/`CLAUDE.md` (test_routing_snippet_sync.py, issues
      # #64/#167's drift guard); `templates/REVIEW.md`/`REVIEW.md`
      # (test_review_template_sync.py); `docs/map/**`
      # (test_map_twins_sync.py); `LICENSE` (test_license_paths_exhaustive.py,
      # walking top-level dirs); `.pre-commit-config.yaml`
      # (test_precommit_ci_version_sync.py); `hooks/**`
      # (test_hooks.py -- NOT covered by being in the `shell` filter below,
      # since `shell` doesn't gate the `tests` step); `.claude-plugin/
      # plugin.json`/`marketplace.json`/`README.md`/`docs/distribution.md`/
      # `docs/install.md`/`docs/collapsed-entrypoints-and-depth-modes.md`/
      # `docs/review-depth-modes.md`/`docs/open-questions.md`
      # (test_doc_counts.py); `.claude/skills/**`
      # (test_self_vendored_skills_sync.py, test_map_twins_sync.py). The
      # rest of `docs/` (session-log.md, runbooks/, plans/) remains
      # genuinely markdown-only -- no test or tooling module reads those
      # paths, and the drift-guard test above would catch it if that ever
      # changed.
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - "skills/**"
              - "collapsed/**"
              - "tooling/**"
              - "tests/**"
              - "docs/research/**"
              - "commands/**"
              - "templates/**"
              - "docs/map/**"
              - "hooks/**"
              - ".claude/skills/**"
              - "AGENTS.md"
              - "CLAUDE.md"
              - "README.md"
              - "REVIEW.md"
              - "LICENSE"
              - ".claude-plugin/plugin.json"
              - ".claude-plugin/marketplace.json"
              - "docs/distribution.md"
              - "docs/install.md"
              - "docs/collapsed-entrypoints-and-depth-modes.md"
              - "docs/review-depth-modes.md"
              - "docs/open-questions.md"
              - "*.py"
              - "pyproject.toml"
              - ".pre-commit-config.yaml"
              - ".github/workflows/ci.yml"
            requirements:
              - "requirements.in"
              - "requirements.txt"
            shell:
              - "tooling/**/*.sh"
              - "hooks/**"
              - "collapsed/hooks/**"
            markdown:
              - "**/*.md"
              - ".markdownlint-cli2.jsonc"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        with:
          python-version: "3.12"
          cache: 'pip'
      - if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: pip install --require-hashes -r requirements.txt
      - name: requirements.txt is in sync with requirements.in
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          # pip-tools 7.6.0 crashed under pip 26.2 (RequirementCommand's
          # make_requirement_preparer gained a required `allow_editables`
          # kwarg pip-tools 7.6.0 didn't pass) — pip-tools 7.6.1 (2026-08-11)
          # fixed that compatibility, so no pip-version workaround is needed
          # any more; pip-tools alone is pinned exact so this step's own gate
          # stays reproducible. Not hash-verified like requirements.txt's
          # deps — considered and deliberately skipped: it's CI-only tooling,
          # not shipped or imported by this repo's own code, and a
          # hash-pinned requirements-dev.txt for one tool was judged not
          # worth the added Dependabot/maintenance surface.
          pip install pip-tools==7.6.1
          # The committed lockfile is seeded into the check dir, not just the .in.
          # Without it pip-compile resolves from scratch and pins whatever is
          # newest on PyPI *today*, so any upstream release turns every open PR
          # red for a reason unrelated to its diff — that happened on three
          # consecutive PRs (#204/#206/#208, all of them a fresh `ruff`). With the
          # lockfile present, pip-compile keeps existing pins that still satisfy
          # requirements.in, so this step asserts what it is named for
          # (lockfile *consistent with* the .in, hashes genuine, no hand-edits)
          # rather than "the lockfile is the newest possible resolution".
          #
          # What this step does NOT check, stated because a first draft of this
          # comment claimed otherwise: with the lockfile seeded, pip-compile
          # reuses an already-satisfying pinned line *verbatim, hash included*,
          # and only computes hashes for packages it newly resolves. So a
          # hand-edited hash on an already-pinned package survives this diff.
          # It does not survive the job: `pip install --require-hashes` above
          # verifies every hash in the committed lockfile against the artifact
          # it downloads, and exits 1 on any mismatch (verified, pip 26.x) —
          # before this step even runs. Hash integrity is that step's; .in
          # consistency is this one's.
          #
          # Freshness is neither step's, and is already owned twice: Dependabot
          # proposes upgrades weekly as their own PRs, and `pip-audit` below
          # fails on a pin with a known CVE — the question that actually matters
          # about a stale pin. Verified against pip-tools 7.6.0 that this check
          # still fails on a raised .in floor and on a dependency dropped from
          # the .in.
          #
          # 2026-08-26: this step went red on every open PR with zero .in/.txt
          # diff in any of them — pip-compile started emitting `--no-index` in
          # its own regenerated header comment (Python 3.12, pip-tools 7.6.1)
          # where it previously didn't. requirements.in itself is NOT fully
          # pinned (>= floors, e.g. `ruff>=0.16.4`) — the reason pip-compile
          # can skip the index is the mechanism the comment block above this
          # one already names: the seeded requirements.txt already carries
          # exact, satisfying pins pip-compile reuses verbatim, and with a
          # warm local wheel cache behind those pins it never needs to query
          # an index to complete the resolution. Confirmed via a from-scratch
          # pip-tools install (its own transitive deps —
          # build/click/pyproject_hooks/setuptools/wheel — are deliberately
          # unpinned per the comment above) that this is deterministic given
          # that seeded lockfile and a satisfiable local cache, not a one-off:
          # it now says so truthfully in the command line it re-emits. Zero
          # package/hash changes accompanied it.
          # Regenerated once to match (no `pip install pip-tools==7.6.1` pin
          # bump involved); if this recurs, regenerate again rather than
          # treating it as a real drift — the diff to actually worry about is
          # in the pinned packages/hashes below this header, not the comment
          # documenting how the file was produced.
          mkdir -p /tmp/reqcheck && cp requirements.in requirements.txt /tmp/reqcheck/
          ( cd /tmp/reqcheck && pip-compile --generate-hashes --output-file=requirements.txt requirements.in )
          diff -u requirements.txt /tmp/reqcheck/requirements.txt || {
            echo "::error::requirements.txt is not consistent with requirements.in (or was hand-edited) — recompile with pip-compile --generate-hashes and commit"
            exit 1
          }
      - name: dependency vulnerability audit
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          # pip-audit IS the CI vulnerability gate this repo relies on — unlike
          # requirements.txt's deps (hash-pinned, resolved once and committed),
          # an unpinned `pip install pip-audit` re-resolves to whatever is
          # newest on PyPI on every run, so the gate itself isn't reproducible:
          # a scanner-tool release could change what CVEs are flagged (or
          # silently drop advisory coverage) with no diff in this repo to
          # review. Pinned exact-version like pip-tools above, though for a
          # different reason: that pin is about the requirements-check step's
          # own reproducibility (a pip-tools release could change what it
          # resolves), this one is about the vulnerability-audit gate's.
          # Like that pin, Dependabot has no manifest that
          # covers a version pinned inline in a `run:` script (its `pip`
          # ecosystem entry tracks requirements.txt/.in; `github-actions`
          # tracks `uses:` refs) — this pin has no automated freshness path.
          # Revisit trigger: bump manually whenever a new pip-audit release
          # ships, at minimum whenever `mise run audit`/this step starts
          # missing a CVE you'd expect it to catch; consider moving this to a
          # Dependabot-tracked requirements-dev.txt if it drifts noticeably.
          pip install pip-audit==2.10.1
          pip-audit --requirement requirements.txt
      - name: lint (ruff)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: ruff check .
      - name: tests
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m pytest tests/ -q
      - name: eval structure (all skills)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m tooling.cli eval
      - name: eval structure (collapsed entrypoints)
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m tooling.cli eval --skills-root collapsed/skills
      - name: provenance drift
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: python -m tooling.cli drift
      - name: Generated trees are in sync
        if: steps.filter.outputs.python == 'true' || steps.filter.outputs.requirements == 'true'
        run: |
          python -m tooling.cli generate --manifest skills/manifest.yaml --docs-root . --skills-root skills --collapsed-root collapsed
          ok=1
          git diff --exit-code skills/    || { git diff --stat skills/;    echo "::error::standalone skills/ drifted — regenerate and commit"; ok=0; }
          git diff --exit-code collapsed/ || { git diff --stat collapsed/; echo "::error::collapsed/ drifted — regenerate and commit"; ok=0; }
          [ "$ok" -eq 1 ]
      - name: markdownlint
        if: steps.filter.outputs.markdown == 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
      - name: shellcheck
        if: steps.filter.outputs.shell == 'true'
        # timeout-minutes is a backstop, not the primary fix: normal runtime here
        # is a few seconds, so 3 minutes only bounds a hang, never a real run.
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Installed from the upstream release rather than apt, deliberately.
          #
          # The previous `apt-get install shellcheck=<exact>` pin coupled this
          # gate to whichever shellcheck version the *runner OS archive*
          # happened to carry, and that broke twice in quick succession as the
          # runner moved: 0.9.0-1 exists on ubuntu-24.04 but not on 25.10, and
          # 0.10.0-1 exists on 25.10 but not on 26.04 (which ships 0.11.0-2).
          # Each move failed the job outright with "Version '<x>' was not
          # found" — a CI break caused purely by infrastructure, with no diff
          # in this repo. Re-pinning to each new OS's version would also
          # silently change *which* shellcheck gates this repo every time the
          # host is rebuilt, which is exactly what an exact pin exists to
          # prevent.
          #
          # The upstream tarball decouples the two: the version is pinned by
          # this file (reproducible, and only ever changed deliberately), and
          # it installs identically on any Linux host regardless of distro or
          # release. Checksums are per-arch and verified, matching the
          # pinned-release-plus-checksum pattern used elsewhere in this org's
          # CI. Both arches are listed so this step stays correct if the job
          # ever moves back to a hosted x86_64 runner.
          #
          # Version is unchanged from the previous pin (0.10.0) — verified
          # again on the current runner that it reports no findings across
          # this repo's scripts, so this is a change of *install mechanism*,
          # not of what the gate enforces.
          version=v0.10.0
          case "$(uname -m)" in
            aarch64|arm64) arch=aarch64; sha=324a7e89de8fa2aed0d0c28f3dab59cf84c6d74264022c00c22af665ed1a09bb ;;
            x86_64|amd64)  arch=x86_64;  sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 ;;
            *) echo "::error::unsupported architecture $(uname -m) for the pinned shellcheck release"; exit 1 ;;
          esac
          curl --connect-timeout 10 --max-time 120 -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.${arch}.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          # $HOME/.local/bin, not /usr/local/bin: a self-hosted runner's user
          # is not guaranteed write access to system directories.
          mkdir -p "$HOME/.local/bin"
          mv "/tmp/shellcheck-${version}/shellcheck" "$HOME/.local/bin/shellcheck"
          chmod +x "$HOME/.local/bin/shellcheck"
          "$HOME/.local/bin/shellcheck" --version
          shopt -s nullglob
          "$HOME/.local/bin/shellcheck" --source-path=SCRIPTDIR -x tooling/*.sh hooks/*.sh hooks/lib/*.sh collapsed/hooks/*.sh collapsed/hooks/lib/*.sh
